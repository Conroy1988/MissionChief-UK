name: Apply Stage 36A field resolution batch 5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/field-resolution-and-equipment-batch-5'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out field-resolution branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/field-resolution-and-equipment-batch-5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply field-resolution migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_stage36a_field_resolution_batch.py
          python scripts/patch_vehicle_resolution_fixture_contract.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate field-resolution registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_vehicle_field_resolution.py
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path('data/schema/vehicle-field-resolution.schema.json').read_text(encoding='utf-8'))
          document = json.loads(Path('data/uk/vehicle-field-resolution.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(document)
          summary = document['summary']
          assert summary['canonical_records'] == 104, summary
          assert summary['tracked_fields'] == 9, summary
          assert summary['total_decisions'] == 936, summary
          assert summary['resolved_decisions'] == 936, summary
          assert summary['unresolved_decisions'] == 0, summary
          assert summary['resolution_percent'] == 100.0, summary
          print(json.dumps(summary, indent=2))
          PY

      - name: Validate canonical vehicle data and generated coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_field_resolution.py --check
          python scripts/generate_vehicle_coverage.py --check

      - name: Synchronize public exports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py

      - name: Run legacy vehicle inventory regressions
        run: python -m unittest tests/python/test_vehicle_inventory.py -v

      - name: Run 100 percent field-resolution regressions
        run: python -m unittest tests/python/test_vehicle_field_resolution.py -v

      - name: Run release-integrity regressions
        run: python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v

      - name: Validate verification programme assets
        run: python scripts/validate_verification_programme_assets.py

      - name: Run release readiness and strict site build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site

      - name: Enforce final 100 percent metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          coverage = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text(encoding='utf-8'))
          summary = coverage['summary']
          resolution = coverage['field_resolution']
          assert summary['canonical_records'] == 104, summary
          assert summary['mapped_inventory_entries'] == 73, summary
          assert summary['unresolved_inventory_entries'] == 0, summary
          assert summary['identity_coverage_percent'] == 100.0, summary
          assert resolution['resolution_percent'] == 100.0, resolution
          assert resolution['unresolved_decisions'] == 0, resolution
          manifest = json.loads(Path('docs/assets/data/v1/manifest.json').read_text(encoding='utf-8'))
          assert manifest['collections']['vehicles']['count'] == 104, manifest
          assert manifest['search']['entity_count'] == 1215, manifest
          print(json.dumps({'coverage': summary, 'resolution': resolution}, indent=2))
          PY
          git diff --check

      - name: Commit field-resolution batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md data/schema/vehicle-field-resolution.schema.json data/sources/missionchief-uk/vehicle-coverage.json data/uk/vehicle-field-resolution.json data/uk/vehicles/water-ladder-with-cafs.json docs/assets/data/official/uk-vehicle-coverage.json docs/assets/data/official/uk-vehicle-field-resolution.json docs/assets/data/v1 docs/index.md docs/reference/generated-faq.md docs/reference/vehicle-coverage-status.md docs/reference/vehicle-field-resolution.md docs/reference/verified-vehicle-field-resolution-batch-5.md mkdocs.yml scripts/generate_vehicle_field_resolution.py scripts/generate_vehicle_coverage.py scripts/vehicle_inventory.py scripts/release_readiness.py tests/python/test_release_integrity.py tests/python/test_vehicle_inventory.py tests/python/test_vehicle_field_resolution.py .github/workflows/vehicle-inventory-validation.yml
          git diff --cached --check
          git commit -m 'Stage 36A: resolve all vehicle data fields'
          git push origin HEAD:stage36a/field-resolution-and-equipment-batch-5
