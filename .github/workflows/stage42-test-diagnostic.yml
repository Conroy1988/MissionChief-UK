name: Diagnose Stage 42 release-integrity tests

on:
  push:
    branches:
      - agent/stage42-v1.4.0-release

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage42-v1.4.0-release
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run release-integrity tests only
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v > stage42-test-diagnostic.txt 2>&1
          echo "exit=$?" >> stage42-test-diagnostic.txt
      - name: Commit concise diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage42-test-diagnostic.yml
          git add stage42-test-diagnostic.txt
          git commit -m 'Stage 42: record release-integrity diagnostic'
          git push origin HEAD:agent/stage42-v1.4.0-release
