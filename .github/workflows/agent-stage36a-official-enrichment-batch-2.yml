name: Apply Stage 36A official enrichment batch 2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-official-enrichment-batch-2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/official-enrichment-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out enrichment branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/official-enrichment-batch-2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply official UK enrichment evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          VEHICLE_ROOT = ROOT / 'data' / 'uk' / 'vehicles'
          CHECKED = '2026-07-25'
          SAR_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1836-what-search-and-rescue-vehicles-are-available-uk-version/'
          FOAM_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1708-which-vehicles-can-carry-foam/'
          DRONE_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1861-what-equipment-is-available-uk-version/'
          EQUIPMENT_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/2002-what-is-equipment-how-can-i-use-it-and-what-equipment-is-available/'

          def read_json(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write_json(path: Path, document):
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def merge_values(existing, additions):
              output = []
              for value in list(existing or []) + list(additions or []):
                  if value not in output:
                      output.append(value)
              return output

          records = {}
          paths = {}
          for path in sorted(VEHICLE_ROOT.glob('*.json')):
              document = read_json(path)
              canonical_id = document.get('id')
              if canonical_id in records:
                  raise SystemExit(f'Duplicate vehicle id: {canonical_id}')
              records[canonical_id] = document
              paths[canonical_id] = path

          def enrich(
              canonical_id: str,
              *,
              source: str,
              resource_class: str,
              cost=None,
              staffing=None,
              training=None,
              buildings=None,
              capabilities=None,
              aliases=None,
              deployment=None,
              transport_capacity=None,
              towable_by=None,
              can_tow=None,
              note: str,
          ):
              if canonical_id not in records:
                  raise SystemExit(f'Missing canonical vehicle record: {canonical_id}')
              document = records[canonical_id]
              document['resource_class'] = resource_class
              if cost is not None:
                  document['cost'] = cost
              if staffing is not None:
                  document['staffing'] = staffing
              if training:
                  document['training'] = merge_values(document.get('training'), training)
              if buildings:
                  document['building_requirements'] = merge_values(document.get('building_requirements'), buildings)
              if capabilities:
                  document['capabilities'] = merge_values(document.get('capabilities'), capabilities)
              if aliases:
                  document['aliases'] = merge_values(document.get('aliases'), aliases)
              if deployment:
                  current = dict(document.get('deployment') or {})
                  for key, value in deployment.items():
                      if key == 'operating_environments':
                          current[key] = merge_values(current.get(key), value)
                      else:
                          current[key] = value
                  document['deployment'] = current
              if transport_capacity:
                  current = dict(document.get('transport_capacity') or {})
                  current.update(transport_capacity)
                  document['transport_capacity'] = current
              if towable_by or can_tow:
                  current = dict(document.get('towing') or {})
                  if towable_by:
                      current['towable_by'] = merge_values(current.get('towable_by'), towable_by)
                  if can_tow:
                      current['can_tow'] = merge_values(current.get('can_tow'), can_tow)
                  document['towing'] = current
              document['notes'] = merge_values(document.get('notes'), [note])
              verification = dict(document.get('verification') or {})
              verification['status'] = 'verified'
              verification['checked_at'] = CHECKED
              verification['sources'] = merge_values(verification.get('sources'), [source])
              document['verification'] = verification
              write_json(paths[canonical_id], document)

          enrich('coastguard_rescue_vehicle', source=SAR_URL, resource_class='vehicle', cost={'credits': 20000, 'coins': 15}, staffing={'minimum': 1, 'maximum': 5}, buildings=['Coastguard Rescue Station', 'Home Response Location'], can_tow=['flood_rescue_unit_trailer'], note='Official UK guidance publishes the CRV crew range, purchase cost, station compatibility and Flood Rescue Unit towing role.')
          enrich('coastguard_mud_rescue_unit', source=SAR_URL, resource_class='vehicle', cost={'credits': 20000, 'coins': 15}, staffing={'minimum': 1, 'maximum': 5}, training=['Mud Rescue Training'], buildings=['Coastguard Rescue Station'], can_tow=['flood_rescue_unit_trailer', 'mud_decontamination_unit'], note='Official UK guidance publishes the Mud Rescue Unit crew range, cost, education and towing relationships.')
          enrich('coastguard_rope_rescue_unit', source=SAR_URL, resource_class='vehicle', cost={'credits': 35000, 'coins': 20}, staffing={'minimum': 1, 'maximum': 5}, training=['Rope Rescue Training'], buildings=['Coastguard Rescue Station'], can_tow=['flood_rescue_unit_trailer'], note='Official UK guidance publishes the Rope Rescue Unit crew range, cost, education and Flood Rescue Unit towing role.')
          enrich('coastguard_commander', source=SAR_URL, resource_class='vehicle', cost={'credits': 25000, 'coins': 15}, staffing={'minimum': 1, 'maximum': 5}, training=['Coastal Command Training'], buildings=['Coastguard Rescue Station', 'Home Response Location'], can_tow=['flood_rescue_unit_trailer'], note='Official UK guidance publishes the Coastguard Commander crew range, cost, education, station compatibility and towing role.')
          enrich('flood_rescue_unit_trailer', source=SAR_URL, resource_class='trailer', cost={'credits': 35000, 'coins': 20}, training=['Flood First Responder Training'], buildings=['Coastguard Rescue Station with Flood Rescue Expansion', 'Lifeboat Station with Flood Rescue Expansion'], deployment={'is_trailer': True, 'operating_environments': ['water', 'flood']}, towable_by=['coastguard_rescue_vehicle', 'coastguard_commander', 'coastguard_mud_rescue_unit', 'coastguard_rope_rescue_unit', 'coastguard_support_unit', 'lifeboat_4x4_vehicle'], note='Official UK guidance publishes the Flood Rescue Unit trailer cost, training, compatible stations and six towing vehicle types.')
          enrich('mud_decontamination_unit', source=SAR_URL, resource_class='trailer', cost={'credits': 35000, 'coins': 20}, training=['Mud Rescue Training'], buildings=['Coastguard Rescue Station with Coastal Rescue Mud Expansion'], deployment={'is_trailer': True}, towable_by=['coastguard_mud_rescue_unit'], note='Official UK guidance publishes the Mud Decontamination Unit trailer cost, education, expansion and exclusive towing vehicle.')
          enrich('coastguard_support_unit', source=SAR_URL, resource_class='vehicle', cost={'credits': 25000, 'coins': 15}, staffing={'minimum': 1, 'maximum': 8}, buildings=['Coastguard Rescue Station'], can_tow=['flood_rescue_unit_trailer'], note='Official UK guidance publishes the Coastguard Support Unit crew range, cost, station compatibility and Flood Rescue Unit towing role.')
          enrich('coastguard_rescue_helicopter', source=SAR_URL, resource_class='aircraft', cost={'credits': 300000, 'coins': 30}, staffing={'minimum': 4, 'maximum': 4}, training=['Coastal Air Rescue Operations'], buildings=['SAR Airbase'], capabilities=['patient_treatment', 'patient_transport', 'coastal_air_rescue'], deployment={'operating_environments': ['air', 'ocean']}, transport_capacity={'patients': 16}, note='Official UK guidance publishes the small Coastguard Rescue Helicopter crew, cost, training, airbase, treatment capability and 16-patient capacity.')
          enrich('hovercraft_trailer', source=SAR_URL, resource_class='trailer', cost={'credits': 35000, 'coins': 20}, staffing={'minimum': 3, 'maximum': 5}, training=['Hover boat commander'], buildings=['Lifeboat Station with Hover Mud Rescue Boat Expansion'], deployment={'is_trailer': True, 'operating_environments': ['water', 'mud']}, towable_by=['hovercraft_transporter'], note='Official UK guidance publishes the Hovercraft Trailer crew, cost, education, expansion and towing vehicle.')
          enrich('lifeboat_4x4_vehicle', source=SAR_URL, resource_class='vehicle', cost={'credits': 10000, 'coins': 10}, staffing={'minimum': 1, 'maximum': 4}, buildings=['Lifeboat Station'], can_tow=['flood_rescue_unit_trailer', 'inland_rescue_boat_trailer', 'rescue_watercraft_trailer'], note='Official UK guidance publishes the Lifeboat 4x4 crew, cost and towing compatibility for water-rescue trailers.')
          enrich('hovercraft_transporter', source=SAR_URL, resource_class='vehicle', cost={'credits': 10000, 'coins': 10}, staffing={'minimum': 1, 'maximum': 1}, buildings=['Lifeboat Station with Hover Mud Rescue Boat Expansion'], can_tow=['hovercraft_trailer'], note='Official UK guidance publishes the Hovercraft Transporter cost, single-person crew, expansion and towing role.')
          enrich('inland_rescue_boat_trailer', source=SAR_URL, resource_class='trailer', cost={'credits': 25000, 'coins': 15}, training=['Lifeboat Operations Training'], buildings=['Lifeboat Station'], deployment={'is_trailer': True, 'operating_environments': ['water']}, towable_by=['lifeboat_4x4_vehicle'], note='Official UK guidance publishes the Inland Rescue Boat trailer cost, education, station and towing vehicle.')
          enrich('inshore_lifeboat', source=SAR_URL, resource_class='vessel', cost={'credits': 25000, 'coins': 15}, staffing={'minimum': 3, 'maximum': 4}, training=['Lifeboat Operations Training'], buildings=['Lifeboat Station'], deployment={'operating_environments': ['water', 'ocean']}, transport_capacity={'patients': 3, 'prisoners': 2}, note='Official UK guidance publishes the ILB crew, cost, education and patient/prisoner capacities.')
          enrich('all_weather_lifeboat', source=SAR_URL, resource_class='vessel', cost={'credits': 40000, 'coins': 25}, staffing={'minimum': 5, 'maximum': 7}, training=['Lifeboat Operations Training'], buildings=['Lifeboat Station'], deployment={'operating_environments': ['water', 'ocean']}, transport_capacity={'patients': 6, 'prisoners': 4}, note='Official UK guidance publishes the ALB crew, cost, education and patient/prisoner capacities.')
          enrich('rescue_watercraft_trailer', source=SAR_URL, resource_class='trailer', cost={'credits': 10000, 'coins': 10}, training=['Lifeboat Operations Training'], buildings=['Lifeboat Station with Beach Lifeguard Unit'], deployment={'is_trailer': True, 'operating_environments': ['water']}, transport_capacity={'patients': 1}, towable_by=['lifeboat_4x4_vehicle'], note='Official UK guidance publishes the Rescue Watercraft cost, education, station, towing vehicle, speed value of 200 and one-patient capacity.')
          enrich('light_4x4', source=SAR_URL, resource_class='vehicle', cost={'credits': 10000, 'coins': 10}, staffing={'minimum': 1, 'maximum': 4}, buildings=['Small Fire Station'], can_tow=['boat_trailer'], note='Official UK guidance publishes the L4V crew, cost, small-station availability and trailer-towing capability.')
          enrich('boat_trailer', source=SAR_URL, resource_class='trailer', cost={'credits': 25000, 'coins': 15}, training=['Technical Rescue'], buildings=['Small Fire Station with Technical Rescue Extension'], deployment={'is_trailer': True, 'operating_environments': ['water']}, towable_by=['light_4x4'], note='Official UK guidance publishes the Boat Trailer cost, education, technical-rescue extension and L4V towing relationship.')

          enrich('bulk_foam_unit', source=FOAM_URL, resource_class='vehicle', cost={'credits': 17300, 'coins': 10}, staffing={'minimum': 1, 'maximum': 2}, buildings=['Fire Station with Fire Support'], note='Official UK foam guidance publishes the Bulk Foam Unit crew, cost and Fire Support availability.')
          enrich('water_foam_carrier', source=FOAM_URL, resource_class='vehicle', cost={'credits': 45000, 'coins': 15}, staffing={'minimum': 1, 'maximum': 2}, buildings=['Fire Station with Fire Support'], note='Official UK foam guidance publishes the Water/Foam Carrier crew, cost and Fire Support availability.')
          enrich('rescue_pump_with_cafs', source=FOAM_URL, resource_class='vehicle', cost={'credits': 25000, 'coins': 10}, staffing={'minimum': 2, 'maximum': 9}, buildings=['Fire Station with Fire Support'], note='Official UK foam guidance publishes the Rescue Pump with CAFS crew, cost and Fire Support availability.')

          enrich('drone', source=DRONE_URL, resource_class='equipment', cost={'credits': 25000, 'coins': 15}, training=['Drone Operator'], buildings=['Fire Station equipment storage', 'Police Station equipment storage'], capabilities=['equipment_deployable'], note='Official UK equipment guidance publishes the drone cost, Drone Operator education and compatibility with UK fire and police equipment storage.')
          drone = records['drone']
          drone['verification']['sources'] = merge_values(drone['verification'].get('sources'), [EQUIPMENT_URL])
          write_json(paths['drone'], drone)

          schema_path = ROOT / 'data' / 'schema' / 'vehicle.schema.json'
          schema = read_json(schema_path)
          properties = schema['properties']
          properties['resource_class'] = {
              'type': 'string',
              'enum': ['vehicle', 'aircraft', 'vessel', 'trailer', 'container', 'equipment'],
          }
          properties['towing'] = {'$ref': '#/$defs/towingInfo'}
          properties['transport_capacity']['properties']['patients'] = {'type': 'integer', 'minimum': 1}
          schema['$defs']['towingInfo'] = {
              'type': 'object',
              'minProperties': 1,
              'properties': {
                  'towable_by': {'type': 'array', 'items': {'type': 'string'}, 'uniqueItems': True, 'minItems': 1},
                  'can_tow': {'type': 'array', 'items': {'type': 'string'}, 'uniqueItems': True, 'minItems': 1},
              },
              'additionalProperties': False,
          }
          write_json(schema_path, schema)

          inventory_module = ROOT / 'scripts' / 'vehicle_inventory.py'
          text = inventory_module.read_text(encoding='utf-8')
          anchor = '        "transport_capacity": count_present(canonical_values, "transport_capacity", nonempty=True),\n'
          if text.count(anchor) != 1:
              raise SystemExit('Vehicle completeness anchor is not unique')
          additions = (
              '        "resource_class": count_present(canonical_values, "resource_class", nonempty=True),\n'
              + anchor
              + '        "towing": count_present(canonical_values, "towing", nonempty=True),\n'
          )
          if '"resource_class": count_present' not in text:
              text = text.replace(anchor, additions)
          inventory_module.write_text(text, encoding='utf-8')

          evidence_path = ROOT / 'docs' / 'reference' / 'verified-vehicle-official-enrichment-batch-2.md'
          evidence_path.write_text('''# Verified Vehicle Enrichment Batch 2\n\nThis Stage 36A batch applies current official UK Help Centre economics and operating contracts to 21 existing canonical resources.\n\n## Scope\n\n- Coastguard, Lifeboat and technical water-rescue vehicles and trailers;\n- UK foam-capable fire vehicles;\n- UK drone equipment;\n- patient and prisoner capacity;\n- formal towing and resource-class contracts.\n\n## Evidence policy\n\nOnly values explicitly published by the official UK Help Centre are promoted. Unpublished defaults, crew values and market restrictions remain omitted. The current game type IDs remain separately evidence-tiered in the vehicle source ledger.\n\n## Primary sources\n\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1836-what-search-and-rescue-vehicles-are-available-uk-version/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1708-which-vehicles-can-carry-foam/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1861-what-equipment-is-available-uk-version/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/2002-what-is-equipment-how-can-i-use-it-and-what-equipment-is-available/\n''', encoding='utf-8')

          mkdocs_path = ROOT / 'mkdocs.yml'
          text = mkdocs_path.read_text(encoding='utf-8')
          anchor = '          - Public Order Vehicle Batch 1: reference/verified-vehicle-public-order-batch-1.md\n'
          addition = anchor + '          - Official Vehicle Enrichment Batch 2: reference/verified-vehicle-official-enrichment-batch-2.md\n'
          if text.count(anchor) != 1:
              raise SystemExit('MkDocs vehicle batch anchor is not unique')
          if 'reference/verified-vehicle-official-enrichment-batch-2.md' not in text:
              text = text.replace(anchor, addition)
          mkdocs_path.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests' / 'python' / 'test_vehicle_official_enrichment.py'
          test_path.write_text('''from __future__ import annotations\n\nimport json\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nVEHICLE_ROOT = ROOT / "data" / "uk" / "vehicles"\n\n\ndef records():\n    output = {}\n    for path in VEHICLE_ROOT.glob("*.json"):\n        document = json.loads(path.read_text(encoding="utf-8"))\n        output[document["id"]] = document\n    return output\n\n\nclass OfficialVehicleEnrichmentTests(unittest.TestCase):\n    def test_search_and_rescue_contracts(self):\n        data = records()\n        self.assertEqual(data["coastguard_rescue_helicopter"]["transport_capacity"]["patients"], 16)\n        self.assertEqual(data["inshore_lifeboat"]["transport_capacity"], {"patients": 3, "prisoners": 2})\n        self.assertEqual(data["all_weather_lifeboat"]["transport_capacity"], {"patients": 6, "prisoners": 4})\n        self.assertIn("flood_rescue_unit_trailer", data["coastguard_rescue_vehicle"]["towing"]["can_tow"])\n        self.assertEqual(data["hovercraft_trailer"]["towing"]["towable_by"], ["hovercraft_transporter"])\n\n    def test_foam_and_drone_contracts(self):\n        data = records()\n        self.assertEqual(data["bulk_foam_unit"]["cost"], {"credits": 17300, "coins": 10})\n        self.assertEqual(data["water_foam_carrier"]["staffing"], {"minimum": 1, "maximum": 2})\n        self.assertEqual(data["rescue_pump_with_cafs"]["staffing"], {"minimum": 2, "maximum": 9})\n        self.assertEqual(data["drone"]["resource_class"], "equipment")\n        self.assertIn("Drone Operator", data["drone"]["training"])\n\n    def test_schema_supports_enrichment_contracts(self):\n        schema = json.loads((ROOT / "data" / "schema" / "vehicle.schema.json").read_text(encoding="utf-8"))\n        self.assertIn("resource_class", schema["properties"])\n        self.assertIn("towing", schema["properties"])\n        self.assertIn("patients", schema["properties"]["transport_capacity"]["properties"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate official enrichment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/vehicle_inventory.py
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest tests/python/test_vehicle_official_enrichment.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text(encoding='utf-8'))
          summary = report['summary']
          fields = report['field_completeness']
          assert summary['canonical_records'] == 92, summary
          assert summary['mapped_inventory_entries'] == 73, summary
          assert summary['unresolved_inventory_entries'] == 0, summary
          assert summary['identity_coverage_percent'] == 100.0, summary
          assert fields['transport_capacity']['complete'] >= 6, fields
          assert fields['resource_class']['complete'] >= 21, fields
          assert fields['towing']['complete'] >= 10, fields
          print(json.dumps({'summary': summary, 'field_completeness': fields}, indent=2))
          PY
          git diff --check

      - name: Commit official enrichment batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            README.md \
            data/schema/vehicle.schema.json \
            data/sources/missionchief-uk/vehicle-coverage.json \
            data/uk/vehicles \
            docs/index.md \
            docs/api/index.md \
            docs/assets/data/v1 \
            docs/assets/data/official/uk-vehicle-coverage.json \
            docs/reference/generated-faq.md \
            docs/reference/vehicle-coverage-status.md \
            docs/reference/verified-vehicle-official-enrichment-batch-2.md \
            docs/releases/v1.2.0.md \
            docs/tools/mission-lookup.md \
            docs/reference/official-mission-catalogue.md \
            mkdocs.yml \
            scripts/vehicle_inventory.py \
            tests/python/test_vehicle_official_enrichment.py \
            .github/workflows/agent-stage36a-official-enrichment-batch-2.yml
          git diff --cached --check
          git commit -m 'Stage 36A: enrich official vehicle contracts batch 2'
          git push origin HEAD:stage36a/official-enrichment-batch-2
