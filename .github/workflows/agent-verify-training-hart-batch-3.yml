name: Verify training and HART batch 3 production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-verify-training-hart-batch-3.yml

permissions:
  actions: read
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'ops/verify-training-hart-batch-3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 32c0d771393e04701166551b7ab06a80449a7952
      REPOSITORY: Conroy1988/MissionChief-UK
      LIVE_ROOT: https://conroy1988.github.io/MissionChief-UK
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v6
        with:
          ref: 32c0d771393e04701166551b7ab06a80449a7952
          fetch-depth: 0

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text(encoding='utf-8'))
          summary = report['summary']
          fields = report['field_completeness']
          assert summary['canonical_records'] == 92
          assert summary['mapped_inventory_entries'] == 73
          assert summary['unresolved_inventory_entries'] == 0
          assert fields['cost']['complete'] == 37
          assert fields['staffing']['complete'] == 30
          assert fields['training']['complete'] == 37
          assert fields['training_requirements']['complete'] == 22
          assert fields['building_requirements']['complete'] == 46
          assert fields['resource_class']['complete'] == 49
          assert fields['transport_capacity']['complete'] == 6
          assert fields['towing']['complete'] == 14
          PY

      - name: Wait for exact main workflows
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/training-hart-verification"
          mkdir -p "$evidence"
          wait_for_workflow() {
            local workflow="$1" label="$2" output="$3"
            for attempt in $(seq 1 150); do
              payload=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=50")
              run=$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"$payload")
              if [[ -n "$run" ]]; then
                status=$(jq -r .status <<<"$run")
                conclusion=$(jq -r '.conclusion // ""' <<<"$run")
                if [[ "$status" == "completed" ]]; then
                  printf '%s\n' "$run" > "$output"
                  [[ "$conclusion" == "success" ]] || { echo "$label failed: $conclusion" >&2; exit 1; }
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Timed out waiting for $label" >&2
            exit 1
          }
          wait_for_workflow vehicle-inventory-validation.yml "Vehicle inventory validation" "$evidence/vehicle-workflow.json"
          wait_for_workflow deploy-pages.yml "Pages deployment" "$evidence/pages-workflow.json"

      - name: Verify live training and HART publication
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/training-hart-verification"
          manifest="$evidence/manifest.json"
          coverage="$evidence/vehicle-coverage.json"
          page="$evidence/training-hart-page.html"
          for attempt in $(seq 1 90); do
            nonce="$(date +%s)-$attempt"
            if curl -fsSL --max-time 30 "$LIVE_ROOT/assets/data/v1/manifest.json?verify=$nonce" -o "$manifest" \
              && curl -fsSL --max-time 30 "$LIVE_ROOT/assets/data/official/uk-vehicle-coverage.json?verify=$nonce" -o "$coverage" \
              && curl -fsSL --max-time 30 "$LIVE_ROOT/reference/verified-vehicle-training-hart-batch-3/?verify=$nonce" -o "$page"; then
              if jq -e '.collections.vehicles.count == 92' "$manifest" >/dev/null \
                && jq -e '.summary.mapped_inventory_entries == 73 and .summary.unresolved_inventory_entries == 0 and .summary.identity_coverage_percent == 100' "$coverage" >/dev/null \
                && jq -e '.field_completeness.cost.complete == 37 and .field_completeness.staffing.complete == 30 and .field_completeness.training.complete == 37 and .field_completeness.training_requirements.complete == 22 and .field_completeness.building_requirements.complete == 46 and .field_completeness.resource_class.complete == 49 and .field_completeness.transport_capacity.complete == 6 and .field_completeness.towing.complete == 14' "$coverage" >/dev/null \
                && grep -q 'Verified Vehicle Training and HART Batch 3' "$page"; then
                jq '{data_version, released_at, stage, status, collections, search_index}' "$manifest" > "$evidence/manifest-summary.json"
                jq '{summary, field_completeness}' "$coverage" > "$evidence/coverage-summary.json"
                printf 'production_sha=%s\nidentity=73/73\ntraining=37/92\ntraining_requirements=22/92\nbuildings=46/92\nresource_class=49/92\n' "$TARGET_SHA" > "$evidence/summary.txt"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Live training/HART publication did not converge.' >&2
          exit 1

      - name: Retain verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: training-hart-batch-3-production-${{ github.run_id }}
          path: ${{ runner.temp }}/training-hart-verification
          if-no-files-found: error
          retention-days: 30

      - name: Delete completed branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete stage36a/training-hart-enrichment-batch-3 || true
          git push origin --delete ops/verify-training-hart-batch-3 || true
