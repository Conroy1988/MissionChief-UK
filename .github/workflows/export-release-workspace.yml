name: Export release workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'release/v1.3.0-stage36a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package repository workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/missionchief-uk-release-workspace.tar.gz" .

      - name: Upload release workspace
        uses: actions/upload-artifact@v4
        with:
          name: missionchief-uk-release-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/missionchief-uk-release-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
