name: Diagnose Stage 36A complete vehicle ID mapping

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'stage36a/complete-vehicle-id-mapping'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage36a/complete-vehicle-id-mapping
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Replay mapping payload
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/agent-stage36a-complete-id-mapping.yml
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" "$source_file" | sed '1d;$d' > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.xz"
          echo "ed2c88877f730b43c0fa6e7821e95a0f43d7597554000572a270a7686472647b  $RUNNER_TEMP/payload.xz" | sha256sum --check
          python - <<'PY'
          import lzma, os
          from pathlib import Path
          source=lzma.decompress(Path(os.environ['RUNNER_TEMP'],'payload.xz').read_bytes()).decode()
          exec(compile(source,'stage36a-complete-id-mapping.py','exec'),{'__name__':'__main__'})
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate canonical data
        run: python scripts/validate_data.py
      - name: Validate vehicle inventory
        run: python scripts/validate_vehicle_inventory.py
      - name: Generate vehicle coverage
        run: python scripts/generate_vehicle_coverage.py
      - name: Check deterministic vehicle coverage
        run: python scripts/generate_vehicle_coverage.py --check
      - name: Synchronize public metrics
        run: python scripts/run_public_verification_sync.py
      - name: Generate exports
        run: python scripts/generate_exports.py
      - name: Generate FAQ
        run: python scripts/generate_faq.py
      - name: Run vehicle tests
        run: python -m unittest tests/python/test_vehicle_inventory.py -v
      - name: Run release-integrity tests
        run: python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
      - name: Validate verification assets
        run: python scripts/validate_verification_programme_assets.py
      - name: Audit release readiness
        run: python scripts/release_readiness.py
      - name: Audit links
        run: python scripts/audit_links.py
      - name: Build strict site
        run: python -m mkdocs build --strict --site-dir site
      - name: Audit built site
        run: python scripts/release_readiness.py --site-dir site
      - name: Assert 100 percent mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text())['summary']
          assert s['inventory_entries']==73 and s['mapped_inventory_entries']==73 and s['unresolved_inventory_entries']==0 and s['identity_coverage_percent']==100.0 and s['canonical_records']==92, s
          print(json.dumps(s,indent=2))
          PY
