name: Validate guide

# Fast, path-aware feedback for active pull-request development. The complete
# release-grade audit runs separately once a pull request is no longer draft.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      interface: ${{ steps.changes.outputs.interface }}
      workflow: ${{ steps.changes.outputs.workflow }}
      release: ${{ steps.changes.outputs.release }}
      data: ${{ steps.changes.outputs.data }}
      vehicle: ${{ steps.changes.outputs.vehicle }}
      vehicle_only: ${{ steps.changes.outputs.vehicle_only }}
      guide_only: ${{ steps.changes.outputs.guide_only }}
      full_required: ${{ steps.changes.outputs.full_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the smallest safe validation lanes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            head="$(git rev-parse HEAD)"
            base="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$head")"
          fi
          python scripts/classify_ci_changes.py \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

  documentation-fast:
    name: Fast documentation build
    needs: classify
    if: >-
      needs.classify.outputs.docs == 'true' ||
      needs.classify.outputs.interface == 'true' ||
      needs.classify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate links and build documentation strictly
        run: |
          python -m unittest tests/test_audit_links.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site

      - name: Upload built site for interface tests
        if: needs.classify.outputs.interface == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-built-site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 1

  data-fast:
    name: Fast structured-data validation
    needs: classify
    if: needs.classify.outputs.data == 'true' && needs.classify.outputs.vehicle_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate canonical and official data contracts
        run: |
          python scripts/validate_data.py
          python scripts/reconcile_official_mission_coverage.py
          python scripts/validate_official_mission_catalogue.py
          python scripts/merge_verification_registry_batches.py
          python scripts/validate_official_key_mappings.py
          python scripts/validate_official_patient_mappings.py
          python scripts/validate_official_personnel_mappings.py
          python scripts/validate_official_personnel_education_mappings.py
          python scripts/validate_official_prisoner_mappings.py
          python scripts/validate_official_recovery_mappings.py
          python scripts/validate_official_operational_mappings.py
          python scripts/generate_full_canonical_catalogue.py --check
          python -m unittest discover -s tests/python -p 'test_*.py' -v

  vehicle-fast:
    name: Fast vehicle intelligence validation
    needs: classify
    if: needs.classify.outputs.vehicle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate inventory, generated evidence and regressions
        run: |
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_field_resolution.py --check
          python scripts/generate_vehicle_coverage.py --check
          python -m unittest \
            tests/python/test_vehicle_inventory.py \
            tests/python/test_vehicle_field_resolution.py -v

  interface-fast:
    name: Fast Chromium interface smoke
    needs: [classify, documentation-fast]
    if: needs.classify.outputs.interface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download the documentation build
        uses: actions/download-artifact@v5
        with:
          name: fast-built-site-${{ github.run_id }}
          path: site

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in docs/javascripts/*.js; do
            node --check "$file"
          done

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run the fast interface suite
        shell: bash
        run: |
          python -m http.server 8000 --directory site > /tmp/missionchief-uk-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/missionchief-uk-http.log
              exit 1
            fi
            sleep 1
          done
          MCUK_BASE_URL=http://127.0.0.1:8000/ \
            npm run test:e2e -- --project=chromium-desktop

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  workflow-fast:
    name: Workflow and classifier validation
    needs: classify
    if: needs.classify.outputs.workflow == 'true' || needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install YAML dependency
        run: python -m pip install -r requirements.txt

      - name: Parse workflows and test change classification
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              document = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              if not isinstance(document, dict) or 'jobs' not in document:
                  raise SystemExit(f'Invalid workflow structure: {path}')
              print(f'parsed {path}')
          PY
          python -m unittest tests/python/test_ci_change_classifier.py -v

  validate:
    name: Validation result
    if: always()
    needs:
      - classify
      - documentation-fast
      - data-fast
      - vehicle-fast
      - interface-fast
      - workflow-fast
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce every selected lane
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCUMENTATION: ${{ needs.documentation-fast.result }}
          DATA: ${{ needs.data-fast.result }}
          VEHICLE: ${{ needs.vehicle-fast.result }}
          INTERFACE: ${{ needs.interface-fast.result }}
          WORKFLOW: ${{ needs.workflow-fast.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CLASSIFY" "$DOCUMENTATION" "$DATA" "$VEHICLE" "$INTERFACE" "$WORKFLOW"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected validation lane ended as: $result"; exit 1 ;;
            esac
          done
          echo "All selected fast validation lanes passed."
