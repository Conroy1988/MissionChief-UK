name: Verify production Pages

# Full browser verification is intentionally asynchronous. It never delays the
# Pages deployment or immutable release publication, but it remains bound to the
# exact deployed main SHA and retains diagnostics on failure.
on:
  workflow_run:
    workflows: ["Deploy MissionChief UK Guide"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser:
    name: Exact-SHA production browser audit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund

      - name: Install complete Playwright browser matrix
        run: npx playwright install --with-deps

      - name: Verify live Pages and API
        run: python scripts/smoke_pages.py "https://conroy1988.github.io/MissionChief-UK/"

      - name: Run complete browser acceptance against production
        env:
          MCUK_BASE_URL: https://conroy1988.github.io/MissionChief-UK/
        run: npm run test:e2e

      - name: Upload retained production diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
