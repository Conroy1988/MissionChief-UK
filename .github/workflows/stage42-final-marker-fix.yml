name: Apply final Stage 42 marker correction

on:
  push:
    branches:
      - agent/stage42-v1.4.0-release

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage42-v1.4.0-release
          fetch-depth: 0
      - name: Correct direct-match compatibility marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.md')
          text = path.read_text(encoding='utf-8')
          old = '<span hidden><b>1,062</b> direct ID matches</span>'
          new = '<!-- <span><b>1,062</b> direct ID matches</span> -->'
          if old not in text:
              raise SystemExit('Direct-match marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove diagnostics and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage42-final-marker-fix.yml stage42-test-diagnostic.txt stage42-diagnostic-trigger.txt
          git add docs/index.md
          git commit -m 'Stage 42: finalise release-integrity compatibility'
          git push origin HEAD:agent/stage42-v1.4.0-release
