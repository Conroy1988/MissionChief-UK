name: Apply complete canonical coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - .handoff/canonical-100-seed.part.*
      - scripts/agent_apply_canonical_coverage.sh
      - .github/workflows/agent-apply-canonical-coverage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-complete-canonical-coverage
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/canonical-coverage-100

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate, validate, commit and push
        id: apply
        continue-on-error: true
        run: bash scripts/agent_apply_canonical_coverage.sh

      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-apply-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-apply-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce apply result
        if: steps.apply.outcome != 'success'
        run: exit 1
