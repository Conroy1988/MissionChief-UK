name: Diagnose Stage 36A public order batch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-public-order-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'stage36a/public-order-vehicle-batch-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage36a/public-order-vehicle-batch-1
      - name: Capture exact applicator failure
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/public-order-diagnostic.log" 2>&1
          from pathlib import Path
          import traceback

          path = Path('.github/workflows/agent-stage36a-public-order-batch-1.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          broken = "old = '\\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())"
          fixed = "old = '\\n'.join(line[6:] if line.startswith('      ') else line for line in old.splitlines())"
          source = source.replace(broken, fixed)
          try:
              exec(compile(source, 'stage36a-public-order-batch-1.py', 'exec'), {'__name__': '__main__'})
          except Exception:
              traceback.print_exc()
              raise
          PY
          code=$?
          cat "$RUNNER_TEMP/public-order-diagnostic.log"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: public-order-batch-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/public-order-diagnostic.log
          if-no-files-found: error
          retention-days: 7
