name: Apply Stage 36A public order vehicle batch 1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-public-order-batch-1.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/public-order-vehicle-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out batch branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/public-order-vehicle-batch-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply official Public Order vehicle evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          PSU_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1740-which-psu-vehicles-are-available-uk-version/'
          DEPOT_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1741-what-is-the-large-police-depot-uk-version/'
          CHECKED = '2026-07-24'

          def read_json(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write_json(path: Path, document, *, compact: bool = False):
              path.parent.mkdir(parents=True, exist_ok=True)
              if compact:
                  content = json.dumps(document, ensure_ascii=False, separators=(',', ':')) + '\n'
              else:
                  content = json.dumps(document, ensure_ascii=False, indent=2) + '\n'
              path.write_text(content, encoding='utf-8')

          vehicle_schema_path = ROOT / 'data/schema/vehicle.schema.json'
          vehicle_schema = read_json(vehicle_schema_path)
          vehicle_schema['properties']['transport_capacity'] = {
              'type': 'object',
              'minProperties': 1,
              'properties': {
                  'prisoners': {'type': 'integer', 'minimum': 1},
                  'dogs': {'type': 'integer', 'minimum': 1},
              },
              'additionalProperties': False,
          }
          write_json(vehicle_schema_path, vehicle_schema)

          version_path = ROOT / 'data/version.json'
          version = read_json(version_path)
          version.setdefault('release_snapshot', {
              'official_missions': 1062,
              'canonical_missions': 1079,
              'direct_matches': 1062,
              'fully_canonical': 1062,
              'vehicles': 59,
              'infrastructure': 19,
              'training': 12,
          })
          write_json(version_path, version)

          ledger_path = ROOT / 'data/sources/missionchief-uk/vehicle-type-inventory.json'
          ledger = read_json(ledger_path)
          ledger['sources']['official-large-police-depot'] = DEPOT_URL
          ledger['updated_at'] = CHECKED
          rows = {row[0]: row for row in ledger['records']}
          mutations = {
              51: ('PSU Carrier', 'psu_carrier', 'verified', []),
              54: ('Detention Van', 'detention_van', 'verified', []),
              55: ('Mounted Unit', 'mounted_unit', 'verified', []),
              56: ('M-RAV', 'm_rav', 'verified', ['The exact official label is M-RAV; MRAV is retained as an alias in the canonical record.']),
          }
          for type_id, (name, canonical_id, label_status, notes) in mutations.items():
              row = rows[type_id]
              row[1] = name
              row[2] = canonical_id
              row[5] = label_status
              row[6] = sorted(set(row[6]) | {'official-psu-vehicles', 'official-large-police-depot'})
              row[7] = notes
          ledger['records'] = sorted(ledger['records'], key=lambda row: row[0])
          write_json(ledger_path, ledger, compact=True)

          extension_path = ROOT / 'data/uk/infrastructure/police-public-order-extension.json'
          extension = read_json(extension_path)
          extension.update({
              'name': 'Police & Public Safety Extension',
              'aliases': ['Police Public Order Extension', 'Public Order Extension'],
              'parent_buildings': ['Police Station', 'Large Police Depot'],
              'capabilities': [
                  'public_order_mission_generation',
                  'public_safety_vehicle_purchase',
                  'detention_van_parking',
              ],
              'notes': [
                  'The official UK Help Centre publishes this exact extension name.',
                  'It costs 100,000 credits or 15 coins and enables specialist Police and Public Safety vehicles.',
              ],
              'verification': {
                  'status': 'verified',
                  'checked_at': CHECKED,
                  'sources': [PSU_URL, DEPOT_URL],
              },
          })
          write_json(extension_path, extension)

          common_buildings = ['Police Station', 'Large Police Depot', 'Police & Public Safety Extension']

          records = {
              'psu-carrier.json': {
                  'id': 'psu_carrier',
                  'name': 'PSU Carrier',
                  'aliases': ['Police Support Unit Carrier'],
                  'service': 'police',
                  'category': 'Public order transport',
                  'cost': {'credits': 8000, 'coins': 10},
                  'staffing': {'minimum': 1, 'maximum': 9},
                  'building_requirements': common_buildings,
                  'capabilities': ['public_order_personnel_transport'],
                  'notes': ['The official Help Centre states that this unit carries up to 9 educated officers.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
              },
              'firearms-personnel-carrier.json': {
                  'id': 'firearms_personnel_carrier',
                  'name': 'Firearms Personnel Carrier',
                  'aliases': [],
                  'service': 'police',
                  'category': 'Firearms personnel transport',
                  'cost': {'credits': 8000, 'coins': 15},
                  'staffing': {'minimum': 1, 'maximum': 9},
                  'training': ['Firearms training'],
                  'building_requirements': common_buildings,
                  'capabilities': ['armed_police_personnel_transport'],
                  'notes': ['The official Help Centre verifies transport of armed police officers. The current game vehicle type ID remains unverified.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
              },
              'multiple-dog-carrier.json': {
                  'id': 'multiple_dog_carrier',
                  'name': 'Multiple Dog Carrier',
                  'aliases': [],
                  'service': 'police',
                  'category': 'Police dog transport',
                  'cost': {'credits': 50000, 'coins': 15},
                  'staffing': {'minimum': 1, 'maximum': 4},
                  'training': ['Dog handling'],
                  'building_requirements': common_buildings,
                  'transport_capacity': {'dogs': 4},
                  'capabilities': ['multiple_police_dog_transport'],
                  'notes': ['The official Help Centre states that the unit carries 4 dogs at maximum crew size. The current game vehicle type ID remains unverified.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
              },
              'detention-van.json': {
                  'id': 'detention_van',
                  'name': 'Detention Van',
                  'aliases': [],
                  'service': 'police',
                  'category': 'Custody transport',
                  'cost': {'credits': 26000, 'coins': 15},
                  'staffing': {'minimum': 1, 'maximum': 2},
                  'building_requirements': common_buildings,
                  'transport_capacity': {'prisoners': 4},
                  'capabilities': ['prisoner_transport'],
                  'notes': ['The official Help Centre states that this unit transports up to 4 prisoners and cannot use other vehicle slots.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
              },
              'm-rav.json': {
                  'id': 'm_rav',
                  'name': 'M-RAV',
                  'aliases': ['MRAV'],
                  'service': 'police',
                  'category': 'Armed response',
                  'cost': {'credits': 10000, 'coins': 23},
                  'staffing': {'minimum': 1, 'maximum': 6},
                  'training': ['Firearms training'],
                  'building_requirements': ['Police Station', 'Large Police Depot'],
                  'capabilities': ['armed_police_response'],
                  'notes': ['The official Help Centre describes the M-RAV as responding to high-risk firearms situations.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
              },
          }
          vehicle_root = ROOT / 'data/uk/vehicles'
          for filename, record in records.items():
              write_json(vehicle_root / filename, record)

          mounted_path = vehicle_root / 'mounted-unit.json'
          mounted = read_json(mounted_path)
          mounted.update({
              'aliases': ['Mounted Units'],
              'category': 'Mounted policing transport',
              'cost': {'credits': 15000, 'coins': 10},
              'staffing': {'minimum': 1, 'maximum': 8},
              'training': ['Mounted Training'],
              'building_requirements': common_buildings,
              'capabilities': ['mounted_policing', 'mounted_officer_transport'],
              'notes': ['The official Help Centre verifies transport of up to 8 Mounted Officers.'],
              'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [PSU_URL, DEPOT_URL]},
          })
          write_json(mounted_path, mounted)

          inventory_module = ROOT / 'scripts/vehicle_inventory.py'
          text = inventory_module.read_text(encoding='utf-8')
          anchor = '        "building_requirements": count_present(canonical_values, "building_requirements", nonempty=True),\n'
          addition = anchor + '        "transport_capacity": count_present(canonical_values, "transport_capacity", nonempty=True),\n'
          if text.count(anchor) != 1:
              raise SystemExit('Vehicle inventory completeness anchor is not unique')
          if '"transport_capacity": count_present' not in text:
              text = text.replace(anchor, addition)
          inventory_module.write_text(text, encoding='utf-8')

          sync_path = ROOT / 'scripts/sync_public_verification_metrics.py'
          text = sync_path.read_text(encoding='utf-8')
          start = text.index('def sync_release(')
          end = text.index('\ndef sync_changelog(', start)
          replacement = '''def release_snapshot_counts() -> dict[str, int]:
              document = read_json(ROOT / "data" / "version.json")
              if not isinstance(document, dict):
                  raise SyncFailure("Release metadata must be an object")
              snapshot = document.get("release_snapshot")
              required = (
                  "official_missions",
                  "canonical_missions",
                  "direct_matches",
                  "fully_canonical",
                  "vehicles",
                  "infrastructure",
                  "training",
              )
              if not isinstance(snapshot, dict) or not all(isinstance(snapshot.get(key), int) for key in required):
                  raise SyncFailure("data/version.json release_snapshot is incomplete")
              return {key: int(snapshot[key]) for key in required}


          def sync_release(text: str, metrics: dict[str, int | float], batches: dict[int, list[str]]) -> str:
              snapshot = release_snapshot_counts()
              awaiting = snapshot["official_missions"] - snapshot["direct_matches"]
              baseline_values = (
                  (r"[\\d,]+ official UK mission records", f"{format_number(snapshot['official_missions'])} official UK mission records", "release official baseline"),
                  (r"[\\d,]+ canonical mission records", f"{format_number(snapshot['canonical_missions'])} canonical mission records", "release canonical baseline"),
                  (r"[\\d,]+ direct official/canonical ID matches", f"{format_number(snapshot['direct_matches'])} direct official/canonical ID matches", "release direct baseline"),
                  (r"[\\d,]+ fully canonical mission records", f"{format_number(snapshot['fully_canonical'])} fully canonical mission records", "release fully baseline"),
                  (r"[\\d,]+ official-only mission records", f"{format_number(awaiting)} official-only mission records", "release awaiting baseline"),
                  (r"[\\d,]+ canonical deployable-resource records", f"{format_number(snapshot['vehicles'])} canonical deployable-resource records", "release resource baseline"),
                  (r"[\\d,]+ canonical infrastructure records", f"{format_number(snapshot['infrastructure'])} canonical infrastructure records", "release infrastructure baseline"),
                  (r"[\\d,]+ qualification records", f"{format_number(snapshot['training'])} qualification records", "release qualification baseline"),
              )
              for pattern, replacement_value, label in baseline_values:
                  text = replace_once(text, pattern, replacement_value, label)
              final_batch = max(batches)
              final_count = len(batches[final_batch])
              text = replace_once(
                  text,
                  r"Batch 31 promotes the final \\*\\*[\\d,]+\\*\\* missions:",
                  f"Batch 31 promotes the final **{format_number(final_count)}** missions:",
                  "release final batch count",
              )
              text = replace_once(
                  text,
                  r"- \\*\\*[\\d,]+\\*\\* missions left outside the fully canonical gate\\.",
                  f"- **{format_number(awaiting)}** missions left outside the fully canonical gate.",
                  "release remaining count",
              )
              return text

          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          text = text[:start] + replacement + text[end + 1:]
          sync_path.write_text(text, encoding='utf-8')

          readiness_path = ROOT / 'scripts/release_readiness.py'
          text = readiness_path.read_text(encoding='utf-8')
          old = '''    release_lines = (
              f"{formatted_count(official)} official UK mission records",
              f"{formatted_count(counts['missions'])} canonical mission records",
              f"{formatted_count(direct)} direct official/canonical ID matches",
              f"{formatted_count(fully)} fully canonical mission records",
              f"{formatted_count(counts['vehicles'])} canonical deployable-resource records",
              f"{formatted_count(counts['infrastructure'])} canonical infrastructure records",
              f"{formatted_count(counts['training'])} qualification records",
          )
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    snapshot = release.get("release_snapshot")
              require(isinstance(snapshot, dict), "data/version.json release_snapshot is missing")
              snapshot_keys = (
                  "official_missions",
                  "canonical_missions",
                  "direct_matches",
                  "fully_canonical",
                  "vehicles",
                  "infrastructure",
                  "training",
              )
              require(
                  all(isinstance(snapshot.get(key), int) for key in snapshot_keys),
                  "data/version.json release_snapshot is incomplete",
              )
              release_lines = (
                  f"{formatted_count(snapshot['official_missions'])} official UK mission records",
                  f"{formatted_count(snapshot['canonical_missions'])} canonical mission records",
                  f"{formatted_count(snapshot['direct_matches'])} direct official/canonical ID matches",
                  f"{formatted_count(snapshot['fully_canonical'])} fully canonical mission records",
                  f"{formatted_count(snapshot['vehicles'])} canonical deployable-resource records",
                  f"{formatted_count(snapshot['infrastructure'])} canonical infrastructure records",
                  f"{formatted_count(snapshot['training'])} qualification records",
              )
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit('Release readiness release-line block is not unique')
          text = text.replace(old, new)
          readiness_path.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests/python/test_release_integrity.py'
          text = test_path.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(metrics["vehicles"], 59)', 'self.assertEqual(metrics["vehicles"], 64)')
          text = text.replace('self.assertEqual(metrics["search_entities"], 1169)', 'self.assertEqual(metrics["search_entities"], 1174)')
          test_path.write_text(text, encoding='utf-8')

          vehicle_test_path = ROOT / 'tests/python/test_vehicle_inventory.py'
          text = vehicle_test_path.read_text(encoding='utf-8')
          anchor = '        self.assertEqual(report["field_completeness"]["staffing"]["complete"], 0)\n'
          if text.count(anchor) != 1:
              raise SystemExit('Vehicle test completeness anchor is not unique')
          if 'transport_capacity' not in text:
              text = text.replace(anchor, anchor + '        self.assertEqual(report["field_completeness"]["transport_capacity"]["complete"], 0)\n')
          vehicle_test_path.write_text(text, encoding='utf-8')

          evidence_path = ROOT / 'docs/reference/verified-vehicle-public-order-batch-1.md'
          evidence_path.write_text(f'''# Verified Public Order Vehicle Batch 1\n\nThis Stage 36A batch records the current official UK Help Centre data for six Public Order and specialist Police vehicles.\n\n| Vehicle | Credits | Coins | Crew | Training | Capacity |\n|---|---:|---:|---:|---|---|\n| PSU Carrier | 8,000 | 10 | 1–9 | — | up to 9 educated officers |\n| Firearms Personnel Carrier | 8,000 | 15 | 1–9 | Firearms training | armed-officer transport |\n| Multiple Dog Carrier | 50,000 | 15 | 1–4 | Dog handling | 4 dogs at maximum crew |\n| Detention Van | 26,000 | 15 | 1–2 | — | 4 prisoners |\n| Mounted Unit | 15,000 | 10 | 1–8 | Mounted Training | up to 8 Mounted Officers |\n| M-RAV | 10,000 | 23 | 1–6 | Firearms training | high-risk firearms response |\n\n## Evidence boundaries\n\n- Official Help Centre labels, costs, crew ranges, education and published capacities are verified.\n- Game type IDs 51, 54, 55 and 56 remain community-observed until reproduced directly in the current UK vehicle market.\n- Firearms Personnel Carrier and Multiple Dog Carrier have no asserted game type ID in the source ledger.\n- The Detention Van's restriction against using other vehicle slots is retained as an operational note.\n\n## Sources\n\n- {PSU_URL}\n- {DEPOT_URL}\n''', encoding='utf-8')

          mkdocs_path = ROOT / 'mkdocs.yml'
          text = mkdocs_path.read_text(encoding='utf-8')
          anchor = '          - Vehicle Coverage Status: reference/vehicle-coverage-status.md\n'
          addition = anchor + '          - Public Order Vehicle Batch 1: reference/verified-vehicle-public-order-batch-1.md\n'
          if text.count(anchor) != 1:
              raise SystemExit('MkDocs vehicle coverage anchor is not unique')
          if 'reference/verified-vehicle-public-order-batch-1.md' not in text:
              text = text.replace(anchor, addition)
          mkdocs_path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate publication outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vehicle_inventory.py \
            scripts/sync_public_verification_metrics.py \
            scripts/release_readiness.py
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/generate_mission_verification_status.py
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          git diff --check

      - name: Commit Public Order batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            README.md \
            CHANGELOG.md \
            data/version.json \
            data/schema/vehicle.schema.json \
            data/sources/missionchief-uk/vehicle-type-inventory.json \
            data/sources/missionchief-uk/vehicle-coverage.json \
            data/sources/missionchief-uk/mission-verification-status.json \
            data/uk/vehicles \
            data/uk/infrastructure/police-public-order-extension.json \
            docs/index.md \
            docs/api/index.md \
            docs/assets/data/v1 \
            docs/assets/data/official/uk-vehicle-coverage.json \
            docs/assets/data/official/uk-mission-verification.json \
            docs/reference/generated-faq.md \
            docs/reference/vehicle-coverage-status.md \
            docs/reference/verified-vehicle-public-order-batch-1.md \
            docs/releases/v1.2.0.md \
            docs/tools/mission-lookup.md \
            docs/reference/official-mission-catalogue.md \
            mkdocs.yml \
            scripts/vehicle_inventory.py \
            scripts/sync_public_verification_metrics.py \
            scripts/release_readiness.py \
            tests/python/test_release_integrity.py \
            tests/python/test_vehicle_inventory.py
          git diff --cached --check
          git commit -m "Stage 36A: verify Public Order vehicle batch 1"
          git push origin HEAD:stage36a/public-order-vehicle-batch-1
