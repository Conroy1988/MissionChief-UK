name: Diagnose Stage 36A vehicle schema errors

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'stage36a/complete-vehicle-id-mapping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage36a/complete-vehicle-id-mapping
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Replay mapping payload
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/agent-stage36a-complete-id-mapping.yml
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" "$source_file" | sed '1d;$d' > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.xz"
          echo "ed2c88877f730b43c0fa6e7821e95a0f43d7597554000572a270a7686472647b  $RUNNER_TEMP/payload.xz" | sha256sum --check
          python - <<'PY'
          import lzma, os
          from pathlib import Path
          source = lzma.decompress(Path(os.environ['RUNNER_TEMP'], 'payload.xz').read_bytes()).decode('utf-8')
          exec(compile(source, 'stage36a-complete-id-mapping.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture canonical validation errors
        shell: bash
        run: |
          set +e
          python scripts/validate_data.py > "$RUNNER_TEMP/validate-data.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$RUNNER_TEMP/validate-data.log"
          tail -n 120 "$RUNNER_TEMP/validate-data.log"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage36a-validate-data-${{ github.run_id }}
          path: ${{ runner.temp }}/validate-data.log
          if-no-files-found: error
          retention-days: 7
