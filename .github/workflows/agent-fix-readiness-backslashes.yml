name: Fix readiness escaped paths

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/agent_fix_readiness_backslashes.py
      - .github/workflows/agent-fix-readiness-backslashes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out drift branch
        uses: actions/checkout@v6
        with:
          ref: agent/official-catalogue-drift-detection
          fetch-depth: 0

      - name: Fix and validate readiness module
        run: |
          python scripts/agent_fix_readiness_backslashes.py
          python -m py_compile scripts/release_readiness.py

      - name: Commit escape correction
        run: |
          rm scripts/agent_fix_readiness_backslashes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release_readiness.py scripts/agent_fix_readiness_backslashes.py
          git commit -m "Fix readiness path escaping"
          git push origin HEAD:agent/official-catalogue-drift-detection
