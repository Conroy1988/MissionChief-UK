name: Deploy MissionChief UK Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages publishing source confirmed as GitHub Actions on 22 July 2026.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build exact Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Run compact deployment integrity gates
        run: |
          python scripts/validate_data.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          for file in docs/javascripts/*.js; do
            node --check "$file"
          done

      - name: Build documentation strictly once
        run: |
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Fast production HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test deployed pages and public API over HTTP
        run: python scripts/smoke_pages.py "${{ needs.deploy.outputs.page_url }}"
