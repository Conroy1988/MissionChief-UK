name: Redirect MissionChief UK Pages to TKB

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - redirect-site/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate permanent redirect artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v6

      - name: Validate redirect mapping
        run: |
          node --check redirect-site/redirect.js
          node redirect-site/redirect.test.cjs
          grep -Fq 'data-tkb-redirect' redirect-site/index.html
          grep -Fq 'data-tkb-redirect' redirect-site/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect-site

  deploy:
    name: Deploy permanent redirects
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live redirect artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Verify root and fallback redirect pages
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 5 "$PAGE_URL" | grep -Fq 'data-tkb-redirect'
          curl -sSL --retry 6 --retry-delay 5 "${PAGE_URL}services/fire-and-rescue/" | grep -Fq 'data-tkb-redirect'
