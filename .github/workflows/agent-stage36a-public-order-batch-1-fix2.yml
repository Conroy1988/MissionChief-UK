name: Apply Stage 36A public order vehicle batch 1 robust fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-public-order-batch-1-fix2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/public-order-vehicle-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out batch branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/public-order-vehicle-batch-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply robust official batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-stage36a-public-order-batch-1.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          block_start = source.index("old = '''    release_lines = (")
          block_end_marker = "readiness_path.write_text(text, encoding='utf-8')"
          block_end = source.index(block_end_marker, block_start) + len(block_end_marker)
          replacement = '''release_block_start = text.index('    release_lines = (\\n', text.index('notes = notes_path.read_text'))
          release_block_end = text.index('    require(f"**Released:', release_block_start)
          new = ''' + '"""' + '''    snapshot = release.get("release_snapshot")
              require(isinstance(snapshot, dict), "data/version.json release_snapshot is missing")
              snapshot_keys = (
                  "official_missions",
                  "canonical_missions",
                  "direct_matches",
                  "fully_canonical",
                  "vehicles",
                  "infrastructure",
                  "training",
              )
              require(
                  all(isinstance(snapshot.get(key), int) for key in snapshot_keys),
                  "data/version.json release_snapshot is incomplete",
              )
              release_lines = (
                  f"{formatted_count(snapshot['official_missions'])} official UK mission records",
                  f"{formatted_count(snapshot['canonical_missions'])} canonical mission records",
                  f"{formatted_count(snapshot['direct_matches'])} direct official/canonical ID matches",
                  f"{formatted_count(snapshot['fully_canonical'])} fully canonical mission records",
                  f"{formatted_count(snapshot['vehicles'])} canonical deployable-resource records",
                  f"{formatted_count(snapshot['infrastructure'])} canonical infrastructure records",
                  f"{formatted_count(snapshot['training'])} qualification records",
              )
          ''' + '"""' + '''
          text = text[:release_block_start] + new + text[release_block_end:]
          readiness_path.write_text(text, encoding='utf-8')'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          source = source[:block_start] + replacement + source[block_end:]
          exec(compile(source, 'stage36a-public-order-batch-1.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate publication outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/vehicle_inventory.py scripts/sync_public_verification_metrics.py scripts/release_readiness.py
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/generate_mission_verification_status.py
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          git diff --check

      - name: Commit Public Order batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md CHANGELOG.md data/version.json data/schema/vehicle.schema.json data/sources/missionchief-uk/vehicle-type-inventory.json data/sources/missionchief-uk/vehicle-coverage.json data/sources/missionchief-uk/mission-verification-status.json data/uk/vehicles data/uk/infrastructure/police-public-order-extension.json docs/index.md docs/api/index.md docs/assets/data/v1 docs/assets/data/official/uk-vehicle-coverage.json docs/assets/data/official/uk-mission-verification.json docs/reference/generated-faq.md docs/reference/vehicle-coverage-status.md docs/reference/verified-vehicle-public-order-batch-1.md docs/releases/v1.2.0.md docs/tools/mission-lookup.md docs/reference/official-mission-catalogue.md mkdocs.yml scripts/vehicle_inventory.py scripts/sync_public_verification_metrics.py scripts/release_readiness.py tests/python/test_release_integrity.py tests/python/test_vehicle_inventory.py
          git diff --cached --check
          git commit -m "Stage 36A: verify Public Order vehicle batch 1"
          git push origin HEAD:stage36a/public-order-vehicle-batch-1
