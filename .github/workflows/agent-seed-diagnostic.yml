name: Diagnose canonical coverage seed

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-seed-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build seed diagnostic report
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git clone -q --depth 1 --branch agent/canonical-coverage-100 https://github.com/Conroy1988/MissionChief-UK.git repo
          cd repo
          report="$RUNNER_TEMP/seed-diagnostic.txt"
          b64="$RUNNER_TEMP/seed.b64"
          archive="$RUNNER_TEMP/seed.tar.xz"
          manifest="$RUNNER_TEMP/manifest.txt"
          failed=0

          cat .handoff/canonical-100-seed.part.* > "$b64"
          actual_b64="$(sha256sum "$b64" | awk '{print $1}')"
          echo "combined_base64_sha=$actual_b64" >> "$report"
          test "$actual_b64" = 'b7858115ff81d68f258d59520b1382634000cc5574ba851f0e5830eb3d73eab0' || failed=1

          if base64 --decode "$b64" > "$archive"; then
            echo 'base64_decode=success' >> "$report"
            actual_archive="$(sha256sum "$archive" | awk '{print $1}')"
            echo "archive_sha=$actual_archive" >> "$report"
            test "$actual_archive" = '6317a49f3dc77c6fa32c1dfcfdeaf0c6b5f605a4c8291df22b7df5657103b1b2' || failed=1
            if xz --test "$archive"; then
              echo 'xz_test=success' >> "$report"
              tar -tJf "$archive" > "$manifest"
              echo "manifest_entries=$(wc -l < "$manifest")" >> "$report"
              forbidden_count="$(grep -Ec '(^|/)\.git(/|$)|(^|/)\.agent(/|$)|(^|/)\.handoff(/|$)|(^|/)\.github/workflows/agent-' "$manifest" || true)"
              echo "forbidden_count=$forbidden_count" >> "$report"
              test "$forbidden_count" = '0' || failed=1
            else
              echo 'xz_test=failure' >> "$report"
              failed=1
            fi
          else
            echo 'base64_decode=failure' >> "$report"
            failed=1
          fi

          registry_count="$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/uk/mission-verification-registry.json').read_text())
          records=payload.get('records')
          print(len(records) if isinstance(records,list) else 'invalid')
          PY
          )"
          echo "registry_count=$registry_count" >> "$report"
          test "$registry_count" = '21' || failed=1
          echo "failed=$failed" >> "$report"
          exit "$failed"

      - name: Upload seed diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-seed-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/seed-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce seed diagnostic result
        if: steps.diagnose.outcome != 'success'
        run: exit 1
