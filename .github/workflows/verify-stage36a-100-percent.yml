name: Verify Stage 36A 100 percent production

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'ops/verify-stage36a-100-percent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPOSITORY: Conroy1988/MissionChief-UK
      TARGET_SHA: 51349847c37726a08a50d812ae1549ddaae08891
      SITE_BASE: https://conroy1988.github.io/MissionChief-UK
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v6
        with:
          ref: 51349847c37726a08a50d812ae1549ddaae08891
          fetch-depth: 0

      - name: Verify repository production state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api repos/$REPOSITORY/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(git show -s --format=%s HEAD)" = "Stage 36A: resolve all vehicle data fields to 100% (#33)"

      - name: Wait for exact main workflows
        shell: bash
        run: |
          set -euo pipefail
          wait_for_workflow() {
            local workflow="$1"
            local output_name="$2"
            local run=""
            local run_id=""
            local status=""
            local conclusion=""
            for _ in $(seq 1 90); do
              run="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=50" --jq ".workflow_runs[] | select(.head_sha == \"$TARGET_SHA\") | [.id, .status, (.conclusion // \"\")] | @tsv" | head -n 1 || true)"
              if [[ -n "$run" ]]; then
                IFS=$'\t' read -r run_id status conclusion <<< "$run"
                if [[ "$status" == "completed" ]]; then
                  [[ "$conclusion" == "success" ]]
                  echo "$output_name=$run_id" >> "$GITHUB_ENV"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Timed out waiting for $workflow at $TARGET_SHA" >&2
            return 1
          }
          wait_for_workflow vehicle-inventory-validation.yml VEHICLE_RUN_ID
          wait_for_workflow deploy-pages.yml PAGES_RUN_ID

      - name: Verify live 100 percent publication
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/stage36a-production-evidence"
          mkdir -p "$evidence"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

          fetch() {
            local path="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 24 --retry-all-errors --retry-delay 5 \
              "$SITE_BASE/$path?sha=$TARGET_SHA" -o "$evidence/$output"
          }

          fetch assets/data/v1/manifest.json manifest.json
          fetch assets/data/v1/vehicles.json vehicles.json
          fetch assets/data/official/uk-vehicle-coverage.json vehicle-coverage.json
          fetch assets/data/official/uk-vehicle-field-resolution.json vehicle-field-resolution.json
          fetch reference/vehicle-field-resolution/ vehicle-field-resolution.html
          fetch reference/verified-vehicle-field-resolution-batch-5/ batch-5.html

          jq -e '.collections.vehicles.count == 104' "$evidence/manifest.json"
          jq -e '.collections.infrastructure.count == 20' "$evidence/manifest.json"
          jq -e '.search_index.count == 1215' "$evidence/manifest.json"

          jq -e '.summary.canonical_records == 104' "$evidence/vehicle-coverage.json"
          jq -e '.summary.mapped_inventory_entries == 73' "$evidence/vehicle-coverage.json"
          jq -e '.summary.unresolved_inventory_entries == 0' "$evidence/vehicle-coverage.json"
          jq -e '.summary.identity_coverage_percent == 100.0' "$evidence/vehicle-coverage.json"
          jq -e '.field_resolution.resolved_decisions == 936' "$evidence/vehicle-coverage.json"
          jq -e '.field_resolution.unresolved_decisions == 0' "$evidence/vehicle-coverage.json"
          jq -e '.field_resolution.resolution_percent == 100.0' "$evidence/vehicle-coverage.json"

          jq -e '.summary.canonical_records == 104' "$evidence/vehicle-field-resolution.json"
          jq -e '.summary.tracked_fields == 9' "$evidence/vehicle-field-resolution.json"
          jq -e '.summary.total_decisions == 936' "$evidence/vehicle-field-resolution.json"
          jq -e '.summary.resolved_decisions == 936' "$evidence/vehicle-field-resolution.json"
          jq -e '.summary.unresolved_decisions == 0' "$evidence/vehicle-field-resolution.json"
          jq -e '.summary.resolution_percent == 100.0' "$evidence/vehicle-field-resolution.json"
          jq -e '[.field_summary[].percent] | all(. == 100.0)' "$evidence/vehicle-field-resolution.json"

          jq -e '.count == 104' "$evidence/vehicles.json"
          jq -e '.records[] | select(.id == "water_ladder_with_cafs") | .cost.credits == 17300 and .cost.coins == 10 and .staffing.minimum == 2 and .staffing.maximum == 9 and (.building_requirements | index("Fire Station with Fire Support") != null)' "$evidence/vehicles.json"

          grep -q 'Decision coverage' "$evidence/vehicle-field-resolution.html"
          grep -q '100.00%' "$evidence/vehicle-field-resolution.html"
          grep -q 'Water Ladder with CAFS' "$evidence/batch-5.html"

      - name: Retain verification evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/runs/$VEHICLE_RUN_ID" > "$EVIDENCE_DIR/vehicle-workflow-run.json"
          gh api "repos/$REPOSITORY/actions/runs/$PAGES_RUN_ID" > "$EVIDENCE_DIR/pages-workflow-run.json"
          cat > "$EVIDENCE_DIR/verification-summary.json" <<JSON
          {
            "repository": "$REPOSITORY",
            "production_sha": "$TARGET_SHA",
            "vehicle_workflow_run_id": $VEHICLE_RUN_ID,
            "pages_workflow_run_id": $PAGES_RUN_ID,
            "canonical_resources": 104,
            "observed_ids_mapped": 73,
            "observed_ids_total": 73,
            "tracked_fields": 9,
            "resolved_field_decisions": 936,
            "total_field_decisions": 936,
            "unresolved_field_decisions": 0,
            "identity_coverage_percent": 100.0,
            "field_resolution_percent": 100.0
          }
          JSON

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage36a-100-percent-production-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Delete completed branches
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/stage36a/field-resolution-and-equipment-batch-5"
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/ops/verify-stage36a-100-percent"
