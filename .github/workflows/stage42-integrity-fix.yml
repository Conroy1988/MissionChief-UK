name: Apply Stage 42 release integrity migration

on:
  push:
    branches:
      - agent/stage42-v1.4.0-release

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage42-v1.4.0-release
          fetch-depth: 0
      - name: Update Stage 42 release contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_function(path: Path, name: str, next_name: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = rf'^def {name}\(.*?(?=^def {next_name}\()'
              updated, count = re.subn(pattern, replacement.rstrip() + '\n\n', text, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'Unable to replace {name} in {path}: {count}')
              path.write_text(updated, encoding='utf-8')

          sync_path = root / 'scripts' / 'sync_public_verification_metrics.py'
          replace_function(sync_path, 'sync_readme', 'sync_home', r'''
          def sync_readme(text: str, metrics: dict[str, int | float], batches: dict[int, list[int]]) -> str:
              del batches
              official = format_number(metrics["official"])
              canonical = format_number(metrics["canonical"])
              direct = format_number(metrics["direct"])
              fully = format_number(metrics["fully"])
              awaiting = format_number(metrics["awaiting"])
              overlays = format_number(metrics["overlays"])
              vehicles = format_number(metrics["vehicles"])
              infrastructure = format_number(metrics["infrastructure"])
              training = format_number(metrics["training"])
              search_entities = format_number(metrics["search_entities"])

              text = replace_once(
                  text,
                  r"\*\*[\d,]+ official UK missions · [\d,]+ canonical mission records · [\d,]+ resources · complete service guides · cross-service strategy · local-only readiness planning · versioned public data\*\*",
                  f"**{official} official UK missions · {canonical} canonical mission records · {vehicles} resources · complete service guides · cross-service strategy · local-only readiness planning · versioned public data**",
                  "README hero metrics",
              )
              text = replace_once(
                  text,
                  r"(\| What UK missions exist\? \| Search all )[\d,]+( retained official mission records and )[\d,]+( canonical records\. \|)",
                  rf"\g<1>{official}\g<2>{canonical}\g<3>",
                  "README mission briefing counts",
              )
              row_values = {
                  "Official UK missions": official,
                  "Canonical missions": canonical,
                  "Direct official/canonical matches": direct,
                  "Fully canonical official records": fully,
                  "Official records awaiting canonical records": awaiting,
                  "Canonical-only overlays": overlays,
                  "Deployable resources": vehicles,
                  "Infrastructure": infrastructure,
                  "Training and role records": training,
                  "Canonical searchable entities": search_entities,
              }
              for label, value in row_values.items():
                  text = replace_once(
                      text,
                      rf"(^\| {re.escape(label)} \| )[\d,]+( \|)",
                      rf"\g<1>{value}\g<2>",
                      f"README {label} row",
                      flags=re.MULTILINE,
                  )
              estate_values = (
                  (r"(├── missions/\s+)[\d,]+( canonical mission records)", canonical, "README mission estate"),
                  (r"(├── vehicles/\s+)[\d,]+( deployable resources)", vehicles, "README resource estate"),
                  (r"(├── infrastructure/\s+)[\d,]+( buildings and extensions)", infrastructure, "README infrastructure estate"),
                  (r"(└── training/\s+)[\d,]+( training and role records)", training, "README training estate"),
              )
              for pattern, value, label in estate_values:
                  text = replace_once(text, pattern, rf"\g<1>{value}\g<2>", label)
              return text
          ''')

          replace_function(sync_path, 'sync_home', 'sync_mission_lookup', r'''
          def sync_home(text: str, metrics: dict[str, int | float]) -> str:
              replacements = (
                  (r'(data-mcuk-metric="official">)[\d,]+(<)', format_number(metrics["official"]), "home hero official"),
                  (r'(data-mcuk-metric="missions">)[\d,]+(<)', format_number(metrics["canonical"]), "home hero canonical"),
                  (r'(data-mcuk-metric="fully-canonical">)[\d,]+(<)', format_number(metrics["fully"]), "home hero fully"),
                  (r'(Search )[\d,]+( official UK missions alongside )[\d,]+( evidence-controlled canonical records and variants\.)', format_number(metrics["official"]), "home lookup official"),
                  (r'(Search [\d,]+ official UK missions alongside )[\d,]+( evidence-controlled canonical records and variants\.)', format_number(metrics["canonical"]), "home lookup canonical"),
                  (r'(data-mcuk-collection="missions">)[\d,]+(<)', format_number(metrics["canonical"]), "home board canonical"),
                  (r'(data-mcuk-verification="fully-canonical">)[\d,]+(<)', format_number(metrics["fully"]), "home board fully"),
                  (r'(data-mcuk-collection="vehicles">)[\d,]+(<)', format_number(metrics["vehicles"]), "home board resource count"),
                  (r'(data-mcuk-collection="infrastructure">)[\d,]+(<)', format_number(metrics["infrastructure"]), "home board infrastructure count"),
                  (r'(data-mcuk-collection="training">)[\d,]+(<)', format_number(metrics["training"]), "home board qualification count"),
                  (r'(data-mcuk-search-count>)[\d,]+(<)', format_number(metrics["search_entities"]), "home search count"),
              )
              for pattern, value, label in replacements:
                  text = replace_once(text, pattern, rf"\g<1>{value}\g<2>", label)
              return text
          ''')

          replace_function(sync_path, 'sync_release', 'sync_changelog', r'''
          def sync_release(text: str, metrics: dict[str, int | float], batches: dict[int, list[str]]) -> str:
              del metrics, batches
              snapshot = release_snapshot_counts()
              awaiting = snapshot["official_missions"] - snapshot["direct_matches"]
              overlays = snapshot["canonical_missions"] - snapshot["direct_matches"]
              row_values = {
                  "Official UK missions": snapshot["official_missions"],
                  "Canonical mission records": snapshot["canonical_missions"],
                  "Direct official matches": snapshot["direct_matches"],
                  "Fully canonical official records": snapshot["fully_canonical"],
                  "Official records awaiting canonical records": awaiting,
                  "Canonical-only overlays or derived records": overlays,
                  "Vehicles and deployable resources": snapshot["vehicles"],
                  "Infrastructure records": snapshot["infrastructure"],
                  "Training and role records": snapshot["training"],
              }
              for label, value in row_values.items():
                  text = replace_once(
                      text,
                      rf"(^\| {re.escape(label)} \| )[\d,]+( \|$)",
                      rf"\g<1>{format_number(value)}\g<2>",
                      f"release {label} row",
                      flags=re.MULTILINE,
                  )
              return text
          ''')

          readiness_path = root / 'scripts' / 'release_readiness.py'
          replace_function(readiness_path, 'audit_catalogue_state_lines', 'flatten_nav', r'''
          def audit_catalogue_state_lines(
              readme: str,
              notes: str,
              awaiting: int,
              overlays: int,
          ) -> None:
              readme_rows = (
                  ("Official records awaiting canonical records", awaiting),
                  ("Canonical-only overlays", overlays),
              )
              for label, value in readme_rows:
                  require_pattern(
                      readme,
                      rf"^\| {re.escape(label)} \| {re.escape(formatted_count(value))} \|",
                      f"README {label} row is stale; expected {formatted_count(value)}",
                  )
              notes_rows = (
                  ("Official records awaiting canonical records", awaiting),
                  ("Canonical-only overlays or derived records", overlays),
              )
              for label, value in notes_rows:
                  require_pattern(
                      notes,
                      rf"^\| {re.escape(label)} \| {re.escape(formatted_count(value))} \|$",
                      f"Release notes {label} row is stale; expected {formatted_count(value)}",
                  )
          ''')

          replace_function(readiness_path, 'audit_publication_metadata', 'audit_exports', r'''
          def audit_publication_metadata(
              release: dict[str, Any],
              counts: dict[str, int],
              summary: dict[str, Any],
          ) -> None:
              version = str(release["version"])
              released_at = str(release["released_at"])
              release_date = date.fromisoformat(released_at)
              human_date = f"{release_date.day} {release_date.strftime('%B %Y')}"
              official = summary.get("official_count")
              direct = summary.get("direct_canonical_id_matches")
              fully = summary.get("cumulative_stage_counts", {}).get("fully-canonical")
              remaining = summary.get("remaining_to_fully_canonical")
              for value, label in (
                  (official, "official"),
                  (direct, "direct canonical match"),
                  (fully, "fully canonical"),
                  (remaining, "remaining verification"),
              ):
                  require(isinstance(value, int), f"Verification {label} count is invalid")
              assert isinstance(official, int)
              assert isinstance(direct, int)
              assert isinstance(fully, int)
              assert isinstance(remaining, int)

              awaiting = official - direct
              overlays = counts["missions"] - direct
              require(awaiting >= 0, "Direct canonical matches exceed the official catalogue")
              require(overlays >= 0, "Direct canonical matches exceed canonical mission records")

              readme = README_PATH.read_text(encoding="utf-8")
              readme_lower = readme.lower()
              readme_words = re.sub(r"[^a-z0-9]+", " ", readme_lower)
              readme_rows = {
                  "Official UK missions": official,
                  "Canonical missions": counts["missions"],
                  "Direct official/canonical matches": direct,
                  "Fully canonical official records": fully,
                  "Official records awaiting canonical records": awaiting,
                  "Canonical-only overlays": overlays,
                  "Deployable resources": counts["vehicles"],
                  "Infrastructure": counts["infrastructure"],
                  "Training and role records": counts["training"],
                  "Canonical searchable entities": sum(counts.values()),
              }
              for label, value in readme_rows.items():
                  require_pattern(
                      readme,
                      rf"^\| {re.escape(label)} \| {re.escape(formatted_count(value))} \|",
                      f"README {label} row is stale; expected {formatted_count(value)}",
                  )
              for label, value in (
                  ("vehicles/", counts["vehicles"]),
                  ("infrastructure/", counts["infrastructure"]),
                  ("training/", counts["training"]),
              ):
                  require_pattern(
                      readme,
                      rf"^[├└]── {re.escape(label)}\s+{re.escape(formatted_count(value))} ",
                      f"README data estate {label} count is stale",
                  )
              stage = int(release["stage"])
              require(
                  f"stage_{stage}_complete" in readme_lower or f"stage {stage} complete" in readme_words,
                  f"README stage badge is not synchronized to Stage {stage}",
              )
              require(
                  version in readme_lower and "static api" in readme_words,
                  f"README does not identify Static API v{version}",
              )
              require("account readiness" in readme_lower, "README does not identify Account Readiness")
              require("stage 42 completion report" in readme_lower, "README does not link the Stage 42 completion report")

              home = HOME_PATH.read_text(encoding="utf-8")
              home_markers = {
                  'data-mcuk-metric="official"': official,
                  'data-mcuk-metric="missions"': counts["missions"],
                  'data-mcuk-metric="fully-canonical"': fully,
                  'data-mcuk-verification="fully-canonical"': fully,
                  'data-mcuk-collection="missions"': counts["missions"],
                  'data-mcuk-collection="vehicles"': counts["vehicles"],
                  'data-mcuk-collection="infrastructure"': counts["infrastructure"],
                  'data-mcuk-collection="training"': counts["training"],
                  "data-mcuk-search-count": sum(counts.values()),
              }
              for marker, value in home_markers.items():
                  require_pattern(
                      home,
                      rf'{re.escape(marker)}>{re.escape(formatted_count(value))}<',
                      f"Home page marker {marker} is stale; expected {formatted_count(value)}",
                  )
              require(f"Released {human_date}" in home, f"Home page release date is stale; expected {human_date}")

              notes_path = ROOT / "docs" / "releases" / f"v{version}.md"
              notes = notes_path.read_text(encoding="utf-8")
              audit_catalogue_state_lines(readme, notes, awaiting, overlays)
              snapshot = release.get("release_snapshot")
              require(isinstance(snapshot, dict), "data/version.json release_snapshot is missing")
              snapshot_keys = (
                  "official_missions",
                  "canonical_missions",
                  "direct_matches",
                  "fully_canonical",
                  "vehicles",
                  "infrastructure",
                  "training",
              )
              require(all(isinstance(snapshot.get(key), int) for key in snapshot_keys), "data/version.json release_snapshot is incomplete")
              notes_rows = {
                  "Official UK missions": snapshot["official_missions"],
                  "Canonical mission records": snapshot["canonical_missions"],
                  "Direct official matches": snapshot["direct_matches"],
                  "Fully canonical official records": snapshot["fully_canonical"],
                  "Official records awaiting canonical records": awaiting,
                  "Canonical-only overlays or derived records": overlays,
                  "Vehicles and deployable resources": snapshot["vehicles"],
                  "Infrastructure records": snapshot["infrastructure"],
                  "Training and role records": snapshot["training"],
              }
              require(f"**Released:** {human_date}" in notes, "Release notes date does not match data/version.json")
              for label, value in notes_rows.items():
                  require_pattern(
                      notes,
                      rf"^\| {re.escape(label)} \| {re.escape(formatted_count(value))} \|$",
                      f"Release notes baseline is stale: {label}={formatted_count(value)}",
                  )

              changelog = CHANGELOG_PATH.read_text(encoding="utf-8")
              require_pattern(changelog, rf"^## \[{re.escape(version)}\] — {re.escape(released_at)}$", "Changelog release date does not match data/version.json")

              api = API_PATH.read_text(encoding="utf-8")
              require(f"Data version: {version}" in api, "API page version is stale")
              require(f"Released: {human_date}" in api, "API page release date is stale")
              require(f'"released_at": "{released_at}"' in api, "API release-date example is stale")

              faq = FAQ_PATH.read_text(encoding="utf-8")
              require(f"data version **{version}** released **{released_at}**" in faq, "Generated FAQ release metadata is stale")
              faq_counts = (
                  f"{formatted_count(counts['missions'])} mission records, "
                  f"{formatted_count(counts['vehicles'])} deployable-resource records, "
                  f"{formatted_count(counts['infrastructure'])} infrastructure records and "
                  f"{formatted_count(counts['training'])} qualification records"
              )
              require(faq_counts in faq, "Generated FAQ collection counts are stale")
          ''')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old = '| Fully canonical official records | 1,062 | Passed all evidence-completeness gates |\n| Deployable resources | 104 | Vehicles, vessels, trailers, equipment and specialist resources |'
          new = '| Fully canonical official records | 1,062 | Passed all evidence-completeness gates |\n| Official records awaiting canonical records | 0 | No current official mission lacks a direct canonical record |\n| Canonical-only overlays | 17 | Explicit variants, overlays and derived records without standalone official IDs |\n| Deployable resources | 104 | Vehicles, vessels, trailers, equipment and specialist resources |'
          if old not in readme:
              raise SystemExit('README release rows insertion point missing')
          readme = readme.replace(old, new, 1)
          old = '| Training and role records | 12 | Verified operational roles and course fields |\n| Service programmes | 10 | Complete guidance for every represented emergency-service group |'
          new = '| Training and role records | 12 | Verified operational roles and course fields |\n| Canonical searchable entities | 1,215 | Missions, resources, infrastructure and qualifications |\n| Service programmes | 10 | Complete guidance for every represented emergency-service group |'
          if old not in readme:
              raise SystemExit('README searchable entities insertion point missing')
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')

          notes_path = root / 'docs' / 'releases' / 'v1.4.0.md'
          notes = notes_path.read_text(encoding='utf-8')
          old = '| Fully canonical official records | 1,062 |\n| Vehicles and deployable resources | 104 |'
          new = '| Fully canonical official records | 1,062 |\n| Official records awaiting canonical records | 0 |\n| Canonical-only overlays or derived records | 17 |\n| Vehicles and deployable resources | 104 |'
          if old not in notes:
              raise SystemExit('Release notes insertion point missing')
          notes_path.write_text(notes.replace(old, new, 1), encoding='utf-8')

          tests_path = root / 'tests' / 'python' / 'test_release_integrity.py'
          tests = tests_path.read_text(encoding='utf-8')
          old_fixture = '''                '<strong data-mcuk-metric="missions">1</strong>',
                          '<strong data-mcuk-metric="fully-canonical">2</strong>',
                          "alongside 3 higher-trust canonical mappings",
                          '<strong data-mcuk-collection="missions">4</strong>',
                          '<strong data-mcuk-verification="fully-canonical">5</strong>',
                          '<strong data-mcuk-collection="vehicles">6</strong>',
                          '<strong data-mcuk-collection="infrastructure">7</strong>',
                          '<strong data-mcuk-collection="training">8</strong>',
                          "<span><b>9</b> direct ID matches</span>",
                          "<b data-mcuk-search-count>10</b>",'''
          new_fixture = '''                '<strong data-mcuk-metric="official">1</strong>',
                          '<strong data-mcuk-metric="missions">2</strong>',
                          '<strong data-mcuk-metric="fully-canonical">3</strong>',
                          "Search 4 official UK missions alongside 5 evidence-controlled canonical records and variants.",
                          '<strong data-mcuk-collection="missions">6</strong>',
                          '<strong data-mcuk-verification="fully-canonical">7</strong>',
                          '<strong data-mcuk-collection="vehicles">8</strong>',
                          '<strong data-mcuk-collection="infrastructure">9</strong>',
                          '<strong data-mcuk-collection="training">10</strong>',
                          "<b data-mcuk-search-count>11</b>",'''
          if old_fixture not in tests:
              raise SystemExit('Home sync fixture not found')
          tests = tests.replace(old_fixture, new_fixture, 1)
          tests = tests.replace('| **Official records awaiting canonical records** | **0** |', '| Official records awaiting canonical records | 0 |')
          tests = tests.replace('| **Canonical-only overlays** | **17** |', '| Canonical-only overlays | 17 |')
          tests = tests.replace('| **Official records awaiting canonical records** | **1** |', '| Official records awaiting canonical records | 1 |')
          tests = tests.replace('| **Canonical-only overlays** | **16** |', '| Canonical-only overlays | 16 |')
          tests = tests.replace('0 official records awaiting direct canonical records', '| Official records awaiting canonical records | 0 |')
          tests = tests.replace('17 canonical overlay or derived records without standalone official IDs', '| Canonical-only overlays or derived records | 17 |')
          tests = tests.replace('1 official records awaiting direct canonical records', '| Official records awaiting canonical records | 1 |')
          tests = tests.replace('16 canonical overlay or derived records without standalone official IDs', '| Canonical-only overlays or derived records | 16 |')
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Commit migrated release contracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage42-integrity-fix.yml stage42-data-diagnostic.txt
          git add README.md docs/releases/v1.4.0.md scripts/sync_public_verification_metrics.py scripts/release_readiness.py tests/python/test_release_integrity.py
          git commit -m 'Stage 42: migrate release integrity to the completed public layout'
          git push origin HEAD:agent/stage42-v1.4.0-release
