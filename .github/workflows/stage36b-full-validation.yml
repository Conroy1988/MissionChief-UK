name: Validate release candidate

# Ready pull requests receive one complete release-grade audit. Draft pull
# requests use the path-aware fast workflow instead. Infrastructure workflow
# changes also run the audit directly on trusted repository branches.
on:
  push:
    branches:
      - "infra/**"
    paths:
      - .github/workflows/validate.yml
      - .github/workflows/branch-validation-report.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/production-pages-verification.yml
      - .github/workflows/vehicle-inventory-validation.yml
      - scripts/classify_ci_changes.py
      - scripts/run_full_data_audit.sh
      - scripts/validate_verification_programme_assets.py
      - tests/python/test_ci_change_classifier.py
      - DELIVERY_ACCELERATION.md
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-candidate-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-integrity:
    name: Complete data and generator audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DIAGNOSTICS_DIR: ${{ runner.temp }}/full-data-audit
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete deterministic data audit
        run: bash scripts/run_full_data_audit.sh

      - name: Upload retained data diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-data-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}
            canonical-candidates.json
            key-mapping-backlog.json
          if-no-files-found: ignore
          retention-days: 14

  documentation:
    name: Strict documentation and built-site audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit links and build once
        run: |
          python -m unittest tests/test_audit_links.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site

      - name: Upload reusable built site
        uses: actions/upload-artifact@v4
        with:
          name: full-built-site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 1

  workflow-integrity:
    name: Workflow structure audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install YAML dependency
        run: python -m pip install -r requirements.txt

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"

      - name: Statically validate every Actions workflow
        run: "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml

      - name: Parse every workflow and test lane classification
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              document = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              if not isinstance(document, dict) or 'jobs' not in document:
                  raise SystemExit(f'Invalid workflow structure: {path}')
              print(f'parsed {path}')
          PY
          python -m unittest tests/python/test_ci_change_classifier.py -v

  browser:
    name: Chromium and WebKit acceptance
    needs: documentation
    if: needs.documentation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download the single audited site build
        uses: actions/download-artifact@v5
        with:
          name: full-built-site-${{ github.run_id }}
          path: site

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in docs/javascripts/*.js; do
            node --check "$file"
          done

      - name: Install only the required browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop and mobile acceptance
        shell: bash
        run: |
          python -m http.server 8000 --directory site > /tmp/missionchief-uk-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/missionchief-uk-http.log
              exit 1
            fi
            sleep 1
          done
          MCUK_BASE_URL=http://127.0.0.1:8000/ \
            npm run test:e2e -- --project=chromium-desktop
          MCUK_BASE_URL=http://127.0.0.1:8000/ \
            npm run test:e2e -- \
              tests/e2e/live-site.spec.mjs \
              --project=webkit-iphone \
              --project=webkit-ipad \
              --grep "renders without runtime or viewport failures"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Release candidate result
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       github.event.label.name == 'full-ci')
    needs: [data-integrity, documentation, workflow-integrity, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish and enforce exact-SHA full-audit result
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ needs.data-integrity.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          WORKFLOW: ${{ needs.workflow-integrity.result }}
          BROWSER: ${{ needs.browser.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="Complete release-grade audit passed"
          for result in "$DATA" "$DOCUMENTATION" "$WORKFLOW" "$BROWSER"; do
            case "$result" in
              success|skipped) ;;
              *) state=failure; description="Complete release-grade audit failed" ;;
            esac
          done

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"stage36b/full-audit\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

          if [ "$state" != success ]; then
            echo "$description"
            exit 1
          fi
          echo "$description"
