name: Verify Stage 42 production release

on:
  push:
    branches:
      - agent/stage42-v1.4.0-release

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage42-v1.4.0-release
          fetch-depth: 0
      - name: Verify release, tag and Pages
        shell: bash
        run: |
          set +e
          report=stage42-postrelease-verification.txt
          : > "$report"
          git fetch --force origin main --tags
          main_sha=$(git rev-parse origin/main)
          tag_sha=$(git rev-parse 'v1.4.0^{commit}' 2>/dev/null)
          echo "main_sha=$main_sha" >> "$report"
          echo "tag_sha=$tag_sha" >> "$report"
          if [ "$main_sha" = "$tag_sha" ]; then echo "tag_matches_main=true" >> "$report"; else echo "tag_matches_main=false" >> "$report"; fi

          release_json=$(gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,publishedAt,url 2>&1)
          release_code=$?
          echo "release_exit=$release_code" >> "$report"
          echo "release_json=$release_json" >> "$report"

          check_url() {
            name="$1"
            url="$2"
            output="/tmp/$name.out"
            code=$(curl --location --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 --silent --show-error --output "$output" --write-out '%{http_code}' "$url")
            echo "${name}_http=$code" >> "$report"
            if [ -f "$output" ]; then
              sha=$(sha256sum "$output" | awk '{print $1}')
              echo "${name}_sha256=$sha" >> "$report"
            fi
          }

          check_url manifest https://conroy1988.github.io/MissionChief-UK/assets/data/v1/manifest.json
          check_url home https://conroy1988.github.io/MissionChief-UK/
          check_url release_page https://conroy1988.github.io/MissionChief-UK/releases/v1.4.0/

          python - <<'PY' >> "$report" 2>&1
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/manifest.out').read_text(encoding='utf-8'))
          print(f"manifest_version={manifest.get('data_version')}")
          print(f"manifest_stage={manifest.get('stage')}")
          print(f"manifest_status={manifest.get('status')}")
          home = Path('/tmp/home.out').read_text(encoding='utf-8')
          release_page = Path('/tmp/release_page.out').read_text(encoding='utf-8')
          print(f"home_has_stage42={'Stage 42' in home}")
          print(f"home_has_v140={'v1.4.0' in home}")
          print(f"release_page_has_v140={'MissionChief UK v1.4.0' in release_page}")
          PY
      - name: Commit verification report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage42-postrelease-verify.yml stage42-postrelease-trigger.txt
          git add stage42-postrelease-verification.txt
          git commit -m 'Stage 42: record post-release production verification'
          git push origin HEAD:agent/stage42-v1.4.0-release
