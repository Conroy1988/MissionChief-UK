name: Prepare MissionChief UK v1.3.0 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-missionchief-uk-v1-3-0-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.3.0-stage36a
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply preparation corrections
        run: python scripts/fix_prepare_v1_3_release.py

      - name: Apply Stage 36 release alignment
        run: python scripts/prepare_v1_3_release.py

      - name: Finalize dynamic release compatibility
        run: python scripts/fix_prepare_v1_3_release.py

      - name: Regenerate deterministic vehicle evidence
        run: |
          python scripts/generate_vehicle_field_resolution.py
          python scripts/generate_vehicle_coverage.py

      - name: Synchronize current publication metrics
        run: |
          python scripts/run_public_verification_sync.py
          python scripts/sync_verification_batch_navigation.py

      - name: Regenerate API and FAQ publications
        run: |
          python scripts/generate_exports.py
          python scripts/generate_faq.py

      - name: Validate release candidate data
        run: |
          python scripts/validate_data.py
          python scripts/reconcile_official_mission_coverage.py
          python scripts/validate_official_mission_catalogue.py
          python scripts/merge_verification_registry_batches.py
          python scripts/validate_official_key_mappings.py
          python scripts/validate_official_patient_mappings.py
          python scripts/validate_official_personnel_mappings.py
          python scripts/validate_official_personnel_education_mappings.py
          python scripts/validate_official_prisoner_mappings.py
          python scripts/validate_official_recovery_mappings.py
          python scripts/validate_official_operational_mappings.py
          python scripts/generate_full_canonical_catalogue.py --check
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_field_resolution.py --check
          python scripts/generate_vehicle_coverage.py --check

      - name: Run release regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s tests/python -p 'test_*.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py

      - name: Build and audit site
        run: |
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site

      - name: Remove temporary preparation scripts
        run: |
          rm -f scripts/prepare_v1_3_release.py
          rm -f scripts/fix_prepare_v1_3_release.py
          rm -rf site

      - name: Commit deterministic release candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged .github/workflows
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes were generated."
            exit 1
          fi
          git commit -m "Release v1.3.0: publish complete Stage 36 resource intelligence"
          git push origin HEAD:release/v1.3.0-stage36a
