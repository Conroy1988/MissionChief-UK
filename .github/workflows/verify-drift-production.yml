name: Diagnose production drift workflow

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-drift-production.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 1ac1773a1f89007409d172bf857d51d62493495f
    steps:
      - name: Locate latest production drift run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drift-diagnostic"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow import-official-uk-missions.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,createdAt,url \
            > "$RUNNER_TEMP/drift-diagnostic/recent-runs.json"
          run_id="$(jq -r --arg sha "$EXPECTED_MAIN_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' "$RUNNER_TEMP/drift-diagnostic/recent-runs.json")"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Capture run metadata and logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,workflowName,url,jobs \
            > "$RUNNER_TEMP/drift-diagnostic/run.json"
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log \
            > "$RUNNER_TEMP/drift-diagnostic/run.log" 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > "$RUNNER_TEMP/drift-diagnostic/artifacts.json"

      - name: Upload drift diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: production-drift-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-diagnostic
          if-no-files-found: error
          retention-days: 14
