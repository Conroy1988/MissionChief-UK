name: Probe production drift dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-drift-production.yml

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture dispatch response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dispatch-probe"
          set +e
          gh workflow run import-official-uk-missions.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            > "$RUNNER_TEMP/dispatch-probe/stdout.txt" \
            2> "$RUNNER_TEMP/dispatch-probe/stderr.txt"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/dispatch-probe/exit-code.txt"
          gh workflow view import-official-uk-missions.yml \
            --repo "$GITHUB_REPOSITORY" \
            --yaml \
            > "$RUNNER_TEMP/dispatch-probe/workflow.yml" 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/import-official-uk-missions.yml" \
            > "$RUNNER_TEMP/dispatch-probe/workflow.json" 2>&1 || true
          cat "$RUNNER_TEMP/dispatch-probe/stdout.txt"
          cat "$RUNNER_TEMP/dispatch-probe/stderr.txt" >&2
          echo "dispatch exit code: $code"

      - name: Upload dispatch probe
        uses: actions/upload-artifact@v4
        with:
          name: production-drift-dispatch-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/dispatch-probe
          if-no-files-found: error
          retention-days: 14
