name: Diagnose production drift execution

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-drift-production.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 78bd730fdbd890adec012992d1e6a8cab86860a4
    steps:
      - name: Capture latest production drift run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/production-drift-diagnostic"
          mkdir -p "$out"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow import-official-uk-missions.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,createdAt,url \
            > "$out/recent-runs.json"
          run_id="$(jq -r --arg sha "$EXPECTED_MAIN_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' "$out/recent-runs.json")"
          test -n "$run_id"
          echo "$run_id" > "$out/run-id.txt"
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,workflowName,url,jobs \
            > "$out/run.json"
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --log \
            > "$out/run.log" 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            > "$out/artifacts.json"

      - name: Upload execution diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: production-drift-execution-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/production-drift-diagnostic
          if-no-files-found: error
          retention-days: 14
