name: Verify final production drift controls

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-drift-production.yml

permissions:
  actions: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_MAIN_SHA: e5594f6d57a3a8b27974fd26c41e9cd64f361991
      VERIFY_BRANCH: ops/verify-drift-production
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0

      - name: Verify production workflow controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_MAIN_SHA"
          workflow=.github/workflows/import-official-uk-missions.yml
          grep -F 'CANDIDATE_DIR=$RUNNER_TEMP/official-uk-candidate' "$workflow"
          grep -F 'DRIFT_DIR=$RUNNER_TEMP/official-uk-drift' "$workflow"
          grep -F 'python -m pip install -r requirements.txt' "$workflow"
          grep -F 'Fail closed on official drift' "$workflow"
          ! grep -F 'git push origin HEAD:main' "$workflow"

      - name: Dispatch and verify production drift workflow
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow import-official-uk-missions.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run import-official-uk-missions.yml --repo "$GITHUB_REPOSITORY" --ref main

          run_id=""
          for attempt in {1..90}; do
            candidate="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow import-official-uk-missions.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 5 \
              --json databaseId,headSha,createdAt \
              --jq '[.[] | select(.headSha == "e5594f6d57a3a8b27974fd26c41e9cd64f361991")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [ -n "$candidate" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,workflowName,url > "$RUNNER_TEMP/production-drift-run.json"

          mkdir -p "$RUNNER_TEMP/production-drift-artifact"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name | startswith("official-uk-catalogue-drift-")) | .name' | head -n 1)"
          test -n "$artifact"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/production-drift-artifact"

          report="$(find "$RUNNER_TEMP/production-drift-artifact" -name official-catalogue-drift.json -print -quit)"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "clean", report
          summary = report["summary"]
          impact = report["impact"]
          assert summary["added_count"] == 0, report
          assert summary["removed_count"] == 0, report
          assert summary["modified_count"] == 0, report
          assert summary["invalidated_fully_canonical_count"] == 0, report
          assert impact["candidate_official_count"] == 1062, report
          assert impact["projected_fully_canonical_count"] == 1062, report
          assert impact["projected_fully_canonical_percent"] == 100.0, report
          PY

      - name: Verify exact Pages deployment and live manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_id=""
          for attempt in {1..120}; do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --branch main --commit "$EXPECTED_MAIN_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty')"
            if [ -n "$row" ]; then
              pages_id="$(jq -r .databaseId <<<"$row")"
              if [ "$(jq -r .status <<<"$row")" = completed ]; then
                test "$(jq -r .conclusion <<<"$row")" = success
                break
              fi
            fi
            sleep 3
          done
          test -n "$pages_id"
          gh run view "$pages_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,workflowName,url > "$RUNNER_TEMP/pages-run.json"

          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          request = Request(
              "https://conroy1988.github.io/MissionChief-UK/assets/data/v1/manifest.json?verify=e5594f6",
              headers={"Cache-Control": "no-cache", "User-Agent": "MissionChief-UK-final-drift-verifier"},
          )
          with urlopen(request, timeout=45) as response:
              manifest = json.load(response)
          assert manifest["data_version"] == "1.2.0", manifest
          assert manifest["stage"] == 35, manifest
          assert manifest["status"] == "production", manifest
          assert manifest["collections"]["missions"]["count"] == 1079, manifest
          assert manifest["collections"]["vehicles"]["count"] == 59, manifest
          assert manifest["collections"]["infrastructure"]["count"] == 19, manifest
          assert manifest["collections"]["training"]["count"] == 12, manifest
          assert manifest["search_index"]["count"] == 1169, manifest
          PY

      - name: Retain final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-drift-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-drift-run.json
            ${{ runner.temp }}/production-drift-artifact
            ${{ runner.temp }}/pages-run.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Delete temporary verifier branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$VERIFY_BRANCH"
