name: Validate drift dependency hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-drift-production.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/drift-workflow-dependencies
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate workflow and governance
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name: Install dependencies' .github/workflows/import-official-uk-missions.yml
          grep -F 'python -m pip install -r requirements.txt' .github/workflows/import-official-uk-missions.yml
          python -m py_compile scripts/release_readiness.py
          python -m unittest tests/test_official_mission_drift.py -v
          python -m unittest discover -s tests/python -p 'test_*.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site

      - name: Exercise clean production drift path
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/official-uk-candidate"
          drift="$RUNNER_TEMP/official-uk-drift"
          mkdir -p "$candidate" "$drift"
          python scripts/import_official_uk_missions.py \
            --output-dir "$candidate" \
            --canonical-dir data/uk/missions
          python scripts/merge_verification_registry_batches.py
          python scripts/detect_official_mission_drift.py \
            --baseline data/sources/missionchief-uk/einsaetze.raw.json \
            --candidate "$candidate/einsaetze.raw.json" \
            --canonical-dir data/uk/missions \
            --registry data/uk/mission-verification-registry.json \
            --json-output "$drift/official-catalogue-drift.json" \
            --markdown-output "$drift/official-catalogue-drift.md"
          python - "$drift/official-catalogue-drift.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "clean", report
          summary = report["summary"]
          assert summary["candidate_official_count"] == 1062, report
          assert summary["verified_candidate_count"] == 1062, report
          assert summary["added_count"] == 0, report
          assert summary["removed_count"] == 0, report
          assert summary["modified_count"] == 0, report
          assert summary["invalidated_count"] == 0, report
          assert summary["projected_coverage_percent"] == 100.0, report
          PY
          python scripts/reconcile_official_mission_coverage.py
          python scripts/validate_official_mission_catalogue.py
          python scripts/validate_official_key_mappings.py
          python scripts/validate_official_patient_mappings.py
          python scripts/validate_official_personnel_mappings.py
          python scripts/validate_official_personnel_education_mappings.py
          python scripts/validate_official_prisoner_mappings.py
          python scripts/validate_official_recovery_mappings.py
          python scripts/validate_official_operational_mappings.py
          python scripts/generate_full_canonical_catalogue.py --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: drift-dependency-hotfix-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/official-uk-candidate
            ${{ runner.temp }}/official-uk-drift
          if-no-files-found: error
          retention-days: 14
