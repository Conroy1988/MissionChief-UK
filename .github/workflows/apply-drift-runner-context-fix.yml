name: Apply drift runner context fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-drift-runner-context-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/drift-runner-temp-context
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply parser-safe runner temp initialisation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/import-official-uk-missions.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_env = (
              '      CANDIDATE_DIR: ${{ runner.temp }}/official-uk-candidate\n'
              '      DRIFT_DIR: ${{ runner.temp }}/official-uk-drift\n'
          )
          if workflow.count(old_env) != 1:
              raise SystemExit('Expected exactly one invalid runner.temp job-level env block')
          workflow = workflow.replace(old_env, '')

          anchor = (
              '      - name: Set up Python\n'
              '        uses: actions/setup-python@v6\n'
              '        with:\n'
              '          python-version: "3.12"\n\n'
          )
          configure = (
              anchor
              + '      - name: Configure isolated candidate paths\n'
              + '        shell: bash\n'
              + '        run: |\n'
              + '          echo "CANDIDATE_DIR=$RUNNER_TEMP/official-uk-candidate" >> "$GITHUB_ENV"\n'
              + '          echo "DRIFT_DIR=$RUNNER_TEMP/official-uk-drift" >> "$GITHUB_ENV"\n\n'
          )
          if workflow.count(anchor) != 1:
              raise SystemExit('Unable to find unique Python setup anchor')
          workflow = workflow.replace(anchor, configure)
          workflow_path.write_text(workflow, encoding='utf-8')

          marker = '"CANDIDATE_DIR: ${{ runner.temp }}/official-uk-candidate",'
          replacements = (
              '\'echo "CANDIDATE_DIR=$RUNNER_TEMP/official-uk-candidate" >> "$GITHUB_ENV"\'',
              '\'echo "DRIFT_DIR=$RUNNER_TEMP/official-uk-drift" >> "$GITHUB_ENV"\'',
          )
          for path in (
              Path('tests/python/test_release_integrity.py'),
              Path('scripts/release_readiness.py'),
          ):
              lines = path.read_text(encoding='utf-8').splitlines()
              rewritten = []
              matches = 0
              for line in lines:
                  if marker in line:
                      matches += 1
                      indent = line[: len(line) - len(line.lstrip())]
                      rewritten.extend(indent + value + ',' for value in replacements)
                  else:
                      rewritten.append(line)
              if matches != 1:
                  raise SystemExit(f'{path}: expected one runner.temp policy marker, found {matches}')
              path.write_text('\n'.join(rewritten) + '\n', encoding='utf-8')
          PY

      - name: Validate fix
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/release_readiness.py
          python -m unittest tests.test_official_mission_drift -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/release_readiness.py
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/import-official-uk-missions.yml \
            scripts/release_readiness.py \
            tests/python/test_release_integrity.py
          git diff --cached --check
          git commit -m "Fix drift workflow runner temp initialisation"
          git push origin HEAD:fix/drift-runner-temp-context
