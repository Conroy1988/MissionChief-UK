name: Patch catalogue drift readiness policy

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-patch-drift-readiness.yml
      - scripts/release_readiness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out drift branch
        uses: actions/checkout@v6
        with:
          ref: agent/official-catalogue-drift-detection
          fetch-depth: 0

      - name: Replace retired refresh policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/release_readiness.py")
          text = path.read_text(encoding="utf-8")

          old_files = '''    "scripts/sync_public_verification_metrics.py",
              "scripts/validate_verification_programme_assets.py",
              "tests/python/test_release_integrity.py",
              "docs/quality-assurance.md",
          )'''
          new_files = '''    "scripts/sync_public_verification_metrics.py",
              "scripts/validate_verification_programme_assets.py",
              "scripts/detect_official_mission_drift.py",
              "tests/test_official_mission_drift.py",
              "tests/python/test_release_integrity.py",
              "docs/quality-assurance.md",
              "CATALOGUE_DRIFT.md",
          )'''

          old_policy = '''    workflow_text = (ROOT / ".github" / "workflows" / "import-official-uk-missions.yml").read_text(encoding="utf-8")
              for marker in (
                  "workflow_dispatch",
                  "schedule:",
                  "reconcile_official_mission_coverage.py",
                  "validate_official_mission_catalogue.py",
                  "merge_verification_registry_batches.py",
                  "validate_official_key_mappings.py",
                  "validate_official_patient_mappings.py",
                  "validate_official_personnel_mappings.py",
                  "validate_official_personnel_education_mappings.py",
                  "validate_official_prisoner_mappings.py",
                  "validate_official_recovery_mappings.py",
                  "python -m unittest discover -s tests/python",
                  "report_canonical_candidates.py",
                  "generate_mission_verification_status.py",
                  "sync_public_verification_metrics.py",
                  "generate_exports.py",
                  "generate_faq.py",
                  "release_readiness.py",
                  "validate_verification_programme_assets.py",
                  "data/sources/missionchief-uk/einsaetze.raw.json",
                  "data/sources/missionchief-uk/mission-coverage.json",
                  "data/sources/missionchief-uk/official-key-inventory.json",
                  "docs/assets/data/official/uk-mission-coverage.json",
                  "docs/assets/data/official/uk-missions.json",
                  "docs/reference/mission-verification-status.md",
                  "git add -A -- data/sources/missionchief-uk/official-missions.json",
                  "git diff --cached --quiet",
                  "gh workflow run deploy-pages.yml --ref main",
              ):
                  require(marker in workflow_text, f"Official catalogue refresh workflow is missing control: {marker}")
          
              for forbidden in (
                  "git add -f data/sources/missionchief-uk",
                  "data/sources/missionchief-uk \\",
                  "docs/assets/data/official \\",
                  "data/sources/missionchief-uk/mission-verification-status.json",
                  "docs/assets/data/official/uk-mission-verification.json",
              ):
                  require(
                      forbidden not in workflow_text,
                      f"Official catalogue refresh workflow stages transient or over-broad path: {forbidden}",
                  )
          '''

          new_policy = '''    workflow_text = (ROOT / ".github" / "workflows" / "import-official-uk-missions.yml").read_text(encoding="utf-8")
              for marker in (
                  "workflow_dispatch",
                  "schedule:",
                  "CANDIDATE_DIR: ${{ runner.temp }}/official-uk-candidate",
                  "detect_official_mission_drift.py",
                  "merge_verification_registry_batches.py",
                  "steps.drift.outputs.has_drift == 'false'",
                  "steps.drift.outputs.has_drift == 'true'",
                  "reconcile_official_mission_coverage.py",
                  "validate_official_mission_catalogue.py",
                  "validate_official_key_mappings.py",
                  "validate_official_patient_mappings.py",
                  "validate_official_personnel_mappings.py",
                  "validate_official_personnel_education_mappings.py",
                  "validate_official_prisoner_mappings.py",
                  "validate_official_recovery_mappings.py",
                  "validate_official_operational_mappings.py",
                  "python -m unittest discover -s tests/python",
                  "report_canonical_candidates.py",
                  "report_key_mapping_backlog.py",
                  "generate_mission_verification_status.py",
                  "validate_verification_programme_assets.py",
                  "release_readiness.py",
                  "data/validation/official-catalogue-drift.json",
                  "docs/reference/official-catalogue-drift-report.md",
                  "automation/official-catalogue-drift-${FINGERPRINT_SHORT}",
                  "gh issue create",
                  "gh pr create",
                  "Fail closed on official drift",
              ):
                  require(marker in workflow_text, f"Official catalogue drift workflow is missing control: {marker}")
          
              for forbidden in (
                  "git push origin HEAD:main",
                  "gh workflow run deploy-pages.yml --ref main",
                  "Deploy refreshed catalogue",
                  "git add -f",
                  "data/sources/missionchief-uk \\",
                  "docs/assets/data/official \\",
                  "data/sources/missionchief-uk/mission-verification-status.json",
                  "docs/assets/data/official/uk-mission-verification.json",
              ):
                  require(
                      forbidden not in workflow_text,
                      f"Official catalogue drift workflow permits unsafe production mutation: {forbidden}",
                  )
          '''

          changed = False
          if old_files in text:
              text = text.replace(old_files, new_files, 1)
              changed = True
          elif new_files not in text:
              raise SystemExit("Required QA file block did not match expected source")

          if old_policy in text:
              text = text.replace(old_policy, new_policy, 1)
              changed = True
          elif new_policy not in text:
              raise SystemExit("Refresh readiness policy block did not match expected source")

          if changed:
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit policy correction
        run: |
          if git diff --quiet -- scripts/release_readiness.py; then
            echo "Readiness policy is already current."
            exit 0
          fi
          python -m py_compile scripts/release_readiness.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release_readiness.py
          git commit -m "Align release readiness with drift control"
          git push origin HEAD:agent/official-catalogue-drift-detection
