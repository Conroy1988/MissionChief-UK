name: Apply Stage 36A foundation on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-pr-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/vehicle-inventory-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/vehicle-inventory-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore checksum-bound foundation payload
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" \
            .github/workflows/agent-stage36a-foundation.yml \
            | sed '1d;$d' \
            > "$RUNNER_TEMP/stage36a-foundation.tar.xz.b64"
          test -s "$RUNNER_TEMP/stage36a-foundation.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/stage36a-foundation.tar.xz.b64" \
            > "$RUNNER_TEMP/stage36a-foundation.tar.xz"
          echo "339c56fa70db5c0b6c92ad348a50c5f08930dd41582408ff4601b21fe95e9db1  $RUNNER_TEMP/stage36a-foundation.tar.xz" \
            | sha256sum --check
          xz --test "$RUNNER_TEMP/stage36a-foundation.tar.xz"
          tar -xJf "$RUNNER_TEMP/stage36a-foundation.tar.xz" -C .

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and generate vehicle coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vehicle_inventory.py \
            scripts/generate_vehicle_coverage.py \
            scripts/validate_vehicle_inventory.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("data/schema/vehicle-inventory.schema.json").read_text(encoding="utf-8"))
          document = json.loads(Path("data/sources/missionchief-uk/vehicle-type-inventory.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(document)
          PY
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          git diff --check

      - name: Commit Stage 36A foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/schema/vehicle-inventory.schema.json \
            data/sources/missionchief-uk/vehicle-type-inventory.json \
            data/sources/missionchief-uk/vehicle-coverage.json \
            docs/assets/data/official/uk-vehicle-coverage.json \
            docs/reference/vehicle-coverage-status.md \
            scripts/vehicle_inventory.py \
            scripts/generate_vehicle_coverage.py \
            scripts/validate_vehicle_inventory.py \
            tests/python/test_vehicle_inventory.py
          git diff --cached --check
          git commit -m "Stage 36A: establish vehicle inventory coverage controls"
          git push origin HEAD:stage36a/vehicle-inventory-foundation
