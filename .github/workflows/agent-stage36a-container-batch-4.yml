name: Apply Stage 36A official container fleet batch 4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-container-batch-4.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/container-fleet-enrichment-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out container branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/container-fleet-enrichment-batch-4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply official UK container evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          VEHICLE_ROOT = ROOT / 'data' / 'uk' / 'vehicles'
          INFRA_ROOT = ROOT / 'data' / 'uk' / 'infrastructure'
          CHECKED = '2026-07-25'
          SOURCE = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1694-what-containers-are-available-uk-version/'
          EXTENSION_NAME = 'Fire Station with Container Extension'

          def write_json(path: Path, document):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          container_specs = [
              ('water_container', 'Water Container', 17300, 8, 'water_supply_container'),
              ('bulk_foam_container', 'Bulk Foam Container', 17300, 8, 'bulk_foam_container'),
              ('rescue_container', 'Rescue Container', 25500, 8, 'technical_rescue_container'),
              ('command_container', 'Command Container', 25500, 8, 'incident_command_container'),
              ('welfare_container', 'Welfare Container', 15000, 8, 'welfare_support_container'),
              ('basu_container', 'BASU Container', 11680, 8, 'breathing_apparatus_support_container'),
              ('misting_container', 'Misting Container', 5000, 8, 'misting_firefighting_container'),
              ('hazmat_container', 'HazMat Container', 19200, 8, 'hazmat_response_container'),
              ('operational_support_unit_container', 'Operational Support Unit Container', 30000, 8, 'operational_support_container'),
              ('high_volume_pump_container', 'High Volume Pump Container', 20000, 8, 'high_volume_pumping_container'),
          ]

          container_ids = [item[0] for item in container_specs]
          carrier = {
              'id': 'container_vehicle',
              'name': 'Container Vehicle',
              'aliases': ['Pod Carrier', 'Container Carrier'],
              'service': 'fire_and_rescue',
              'category': 'Container transport',
              'resource_class': 'vehicle',
              'cost': {'credits': 10000, 'coins': 10},
              'staffing': {'minimum': 1, 'maximum': 2},
              'building_requirements': [EXTENSION_NAME],
              'towing': {'can_tow': container_ids},
              'capabilities': ['container_transport'],
              'notes': ['The official UK Help Centre identifies this as the towing vehicle for every published UK container pod.'],
              'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [SOURCE]},
          }
          write_json(VEHICLE_ROOT / 'container-vehicle.json', carrier)

          for canonical_id, name, credits, coins, capability in container_specs:
              document = {
                  'id': canonical_id,
                  'name': name,
                  'aliases': [],
                  'service': 'fire_and_rescue',
                  'category': 'Container pod',
                  'resource_class': 'container',
                  'cost': {'credits': credits, 'coins': coins},
                  'building_requirements': [EXTENSION_NAME],
                  'towing': {'towable_by': ['container_vehicle']},
                  'capabilities': [capability],
                  'notes': ['The official UK Help Centre publishes this as a container pod transported by the Container Vehicle.'],
                  'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [SOURCE]},
              }
              write_json(VEHICLE_ROOT / f"{canonical_id.replace('_', '-')}.json", document)

          extension = {
              'id': 'container_extension',
              'name': 'Container Extension',
              'aliases': ['Fire Station Container Extension', EXTENSION_NAME],
              'kind': 'extension',
              'service': 'fire_and_rescue',
              'parent_buildings': ['Fire Station'],
              'capabilities': ['container_vehicle_purchase', 'container_storage'],
              'notes': [
                  'The official UK container article requires this extension for the Container Vehicle and every published container pod.',
                  'Extension cost, construction time and storage capacity remain unpublished in the retained source and are intentionally omitted.',
              ],
              'verification': {'status': 'verified', 'checked_at': CHECKED, 'sources': [SOURCE]},
          }
          write_json(INFRA_ROOT / 'container-extension.json', extension)

          test_path = ROOT / 'tests' / 'python' / 'test_release_integrity.py'
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              'self.assertEqual(metrics["vehicles"], 92)': 'self.assertEqual(metrics["vehicles"], 103)',
              'self.assertEqual(metrics["infrastructure"], 19)': 'self.assertEqual(metrics["infrastructure"], 20)',
              'self.assertEqual(metrics["search_entities"], 1202)': 'self.assertEqual(metrics["search_entities"], 1214)',
              "self.assertIn('data-mcuk-collection=\"vehicles\">92<', updated)": "self.assertIn('data-mcuk-collection=\"vehicles\">103<', updated)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Release integrity count anchor is not unique: {old}')
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')

          evidence_path = ROOT / 'docs' / 'reference' / 'verified-vehicle-container-fleet-batch-4.md'
          evidence_path.write_text('''# Verified UK Container Fleet Batch 4\n\nThis Stage 36A batch records the complete container fleet published by the official MissionChief UK Help Centre.\n\n## Carrier\n\n| Resource | Crew | Credits | Coins | Available at |\n|---|---:|---:|---:|---|\n| Container Vehicle | 1–2 | 10,000 | 10 | Fire Station with Container Extension |\n\n## Container pods\n\n| Container | Credits | Coins | Towing vehicle |\n|---|---:|---:|---|\n| Water Container | 17,300 | 8 | Container Vehicle |\n| Bulk Foam Container | 17,300 | 8 | Container Vehicle |\n| Rescue Container | 25,500 | 8 | Container Vehicle |\n| Command Container | 25,500 | 8 | Container Vehicle |\n| Welfare Container | 15,000 | 8 | Container Vehicle |\n| BASU Container | 11,680 | 8 | Container Vehicle |\n| Misting Container | 5,000 | 8 | Container Vehicle |\n| HazMat Container | 19,200 | 8 | Container Vehicle |\n| Operational Support Unit Container | 30,000 | 8 | Container Vehicle |\n| High Volume Pump Container | 20,000 | 8 | Container Vehicle |\n\n## Evidence boundary\n\nThe official article publishes the carrier crew range, all purchase prices, the common extension and the towing relationship. Container staffing, extension price, build time and storage capacity are not published and remain omitted. These resources have no asserted current game vehicle type IDs in the observed-ID ledger.\n\n## Source\n\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1694-what-containers-are-available-uk-version/\n''', encoding='utf-8')

          mkdocs_path = ROOT / 'mkdocs.yml'
          text = mkdocs_path.read_text(encoding='utf-8')
          anchor = '          - Vehicle Training & HART Batch 3: reference/verified-vehicle-training-hart-batch-3.md\n'
          addition = anchor + '          - UK Container Fleet Batch 4: reference/verified-vehicle-container-fleet-batch-4.md\n'
          if text.count(anchor) != 1:
              raise SystemExit('MkDocs Batch 3 anchor is not unique')
          if 'reference/verified-vehicle-container-fleet-batch-4.md' not in text:
              text = text.replace(anchor, addition)
          mkdocs_path.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests' / 'python' / 'test_vehicle_container_fleet.py'
          test_path.write_text('''from __future__ import annotations\n\nimport json\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nVEHICLE_ROOT = ROOT / "data" / "uk" / "vehicles"\n\n\ndef records():\n    output = {}\n    for path in VEHICLE_ROOT.glob("*.json"):\n        document = json.loads(path.read_text(encoding="utf-8"))\n        output[document["id"]] = document\n    return output\n\n\nclass ContainerFleetTests(unittest.TestCase):\n    def test_complete_official_container_fleet(self):\n        data = records()\n        expected = {\n            "water_container": 17300,\n            "bulk_foam_container": 17300,\n            "rescue_container": 25500,\n            "command_container": 25500,\n            "welfare_container": 15000,\n            "basu_container": 11680,\n            "misting_container": 5000,\n            "hazmat_container": 19200,\n            "operational_support_unit_container": 30000,\n            "high_volume_pump_container": 20000,\n        }\n        carrier = data["container_vehicle"]\n        self.assertEqual(carrier["staffing"], {"minimum": 1, "maximum": 2})\n        self.assertEqual(carrier["cost"], {"credits": 10000, "coins": 10})\n        self.assertEqual(set(carrier["towing"]["can_tow"]), set(expected))\n        for canonical_id, credits in expected.items():\n            record = data[canonical_id]\n            self.assertEqual(record["resource_class"], "container")\n            self.assertEqual(record["cost"], {"credits": credits, "coins": 8})\n            self.assertEqual(record["towing"], {"towable_by": ["container_vehicle"]})\n            self.assertIn("Fire Station with Container Extension", record["building_requirements"])\n\n    def test_container_extension_exists(self):\n        extension = json.loads((ROOT / "data" / "uk" / "infrastructure" / "container-extension.json").read_text(encoding="utf-8"))\n        self.assertEqual(extension["id"], "container_extension")\n        self.assertIn("Fire Station", extension["parent_buildings"])\n        self.assertIn("container_storage", extension["capabilities"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate container fleet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest tests/python/test_vehicle_official_enrichment.py -v
          python -m unittest tests/python/test_vehicle_training_hart_enrichment.py -v
          python -m unittest tests/python/test_vehicle_container_fleet.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text(encoding='utf-8'))
          summary = report['summary']
          fields = report['field_completeness']
          assert summary['canonical_records'] == 103, summary
          assert summary['mapped_inventory_entries'] == 73, summary
          assert summary['unresolved_inventory_entries'] == 0, summary
          assert summary['identity_coverage_percent'] == 100.0, summary
          assert fields['cost']['complete'] == 48, fields
          assert fields['staffing']['complete'] == 31, fields
          assert fields['training']['complete'] == 37, fields
          assert fields['training_requirements']['complete'] == 22, fields
          assert fields['building_requirements']['complete'] == 57, fields
          assert fields['resource_class']['complete'] == 60, fields
          assert fields['transport_capacity']['complete'] == 6, fields
          assert fields['towing']['complete'] == 25, fields
          print(json.dumps({'summary': summary, 'field_completeness': fields}, indent=2))
          PY
          git diff --check

      - name: Commit official container fleet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            README.md \
            data/sources/missionchief-uk/vehicle-coverage.json \
            data/uk/vehicles \
            data/uk/infrastructure/container-extension.json \
            docs/index.md \
            docs/api/index.md \
            docs/assets/data/v1 \
            docs/assets/data/official/uk-vehicle-coverage.json \
            docs/reference/generated-faq.md \
            docs/reference/vehicle-coverage-status.md \
            docs/reference/verified-vehicle-container-fleet-batch-4.md \
            docs/releases/v1.2.0.md \
            docs/tools/mission-lookup.md \
            docs/reference/official-mission-catalogue.md \
            mkdocs.yml \
            tests/python/test_release_integrity.py \
            tests/python/test_vehicle_container_fleet.py \
            .github/workflows/agent-stage36a-container-batch-4.yml
          git diff --cached --check
          git commit -m 'Stage 36A: add official UK container fleet batch 4'
          git push origin HEAD:stage36a/container-fleet-enrichment-batch-4
