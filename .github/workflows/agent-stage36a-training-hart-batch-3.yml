name: Apply Stage 36A training and HART enrichment batch 3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-stage36a-training-hart-batch-3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/training-hart-enrichment-batch-3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out enrichment branch
        uses: actions/checkout@v6
        with:
          ref: stage36a/training-hart-enrichment-batch-3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply official training and specialist-base evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          VEHICLE_ROOT = ROOT / 'data' / 'uk' / 'vehicles'
          CHECKED = '2026-07-25'
          TRAINING_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1603-which-training-is-useful-for-what/'
          HART_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1736-what-is-a-hart-base/'
          LARGE_POLICE_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1741-what-is-the-large-police-depot-uk-version/'
          SMALL_AMBULANCE_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1715-what-is-a-small-ambulance-station/'
          HELICOPTER_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1720-what-is-a-helicopter-station/'
          POLICE_HELICOPTER_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1731-what-is-a-police-helicopter-station/'
          PSU_URL = 'https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1740-which-psu-vehicles-are-available-uk-version/'

          def read_json(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write_json(path: Path, document):
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def merge_values(existing, additions):
              output = []
              for value in list(existing or []) + list(additions or []):
                  if value not in output:
                      output.append(value)
              return output

          records = {}
          paths = {}
          for path in sorted(VEHICLE_ROOT.glob('*.json')):
              document = read_json(path)
              canonical_id = document.get('id')
              if canonical_id in records:
                  raise SystemExit(f'Duplicate vehicle id: {canonical_id}')
              records[canonical_id] = document
              paths[canonical_id] = path

          def require_record(canonical_id: str):
              if canonical_id not in records:
                  raise SystemExit(f'Missing canonical vehicle record: {canonical_id}')
              return records[canonical_id]

          def retain_source(document, source: str):
              verification = dict(document.get('verification') or {})
              verification.setdefault('status', 'verified')
              verification['checked_at'] = CHECKED
              verification['sources'] = merge_values(verification.get('sources'), [source])
              document['verification'] = verification

          def add_training(canonical_id: str, course: str, duration_days: int, school: str, *, source: str = TRAINING_URL, resource_class: str = 'vehicle', note: str | None = None):
              document = require_record(canonical_id)
              document['resource_class'] = resource_class
              document['training'] = merge_values(document.get('training'), [course])
              requirements = list(document.get('training_requirements') or [])
              replacement = {'course': course, 'duration_days': duration_days, 'school': school}
              requirements = [item for item in requirements if item.get('course') != course]
              requirements.append(replacement)
              requirements.sort(key=lambda item: item['course'].casefold())
              document['training_requirements'] = requirements
              if note:
                  document['notes'] = merge_values(document.get('notes'), [note])
              retain_source(document, source)
              write_json(paths[canonical_id], document)

          def add_buildings(canonical_id: str, buildings, source: str, *, aliases=None, resource_class: str = 'vehicle', note: str):
              document = require_record(canonical_id)
              document['resource_class'] = resource_class
              document['building_requirements'] = merge_values(document.get('building_requirements'), buildings)
              if aliases:
                  document['aliases'] = merge_values(document.get('aliases'), aliases)
              document['notes'] = merge_values(document.get('notes'), [note])
              retain_source(document, source)
              write_json(paths[canonical_id], document)

          # UK Fire Academy course-to-vehicle contracts.
          add_training('hazmat_unit', 'HazMat', 3, 'Fire Academy', note='The official UK training matrix requires the three-day HazMat course to operate HazMat vehicles and units.')
          add_training('iccu', 'Mobile command', 5, 'Fire Academy', note='The official UK training matrix requires the five-day Mobile command course for mobile command vehicles.')
          for canonical_id in ('major_foam_tender', 'riv', 'airfield_firefighting_command_vehicle'):
              add_training(canonical_id, 'ARFF-Training', 3, 'Fire Academy', note='The official UK training matrix requires the three-day ARFF-Training course for airport-specific firefighting vehicles.')

          # UK Rescue (EMS) Academy course-to-vehicle contracts.
          add_training('air_ambulance', 'Critical care', 5, 'Rescue (EMS) Academy', resource_class='aircraft', note='The official UK training matrix requires the five-day Critical care course to operate HEMS.')
          for canonical_id in ('prv', 'srv'):
              add_training(canonical_id, 'HART Training', 5, 'Rescue (EMS) Academy', note='The official UK training matrix requires the five-day HART Training course for Primary and Secondary Response Vehicles.')
          for canonical_id in ('ambulance_control_unit', 'atv_carrier'):
              add_training(canonical_id, 'Tactical Command Course', 5, 'Rescue (EMS) Academy', note='The official UK training matrix requires the five-day Tactical Command Course for the Ambulance Control Unit and ATV Carrier.')
          for canonical_id in ('mass_casualty_equipment', 'cbrn_vehicle'):
              add_training(canonical_id, 'SORT Training', 3, 'Rescue (EMS) Academy', note='The official UK training matrix requires the three-day SORT Training course for Mass Casualty Equipment and the CBRN Vehicle.')
          add_training('ambulance_officer_vehicle', 'Ambulance Officer', 5, 'Rescue (EMS) Academy', note='The official UK training matrix publishes a five-day Ambulance Officer course for the Ambulance Officer vehicle.')

          # UK Police training centre contracts.
          add_training('police_helicopter', 'Police aviation', 7, 'Police training centre', resource_class='aircraft', note='The official UK training matrix requires the seven-day Police aviation course for police helicopters.')
          add_training('armed_response_vehicle', 'Firearms training', 5, 'Police training centre', note='The official UK training matrix requires the five-day Firearms training course for ARVs.')
          for canonical_id in ('m_rav', 'firearms_personnel_carrier'):
              add_training(canonical_id, 'Firearms training', 5, 'Police training centre', source=PSU_URL, note='The official PSU vehicle page requires Firearms training; the UK training matrix publishes the course duration as five days.')
              document = records[canonical_id]
              retain_source(document, TRAINING_URL)
              write_json(paths[canonical_id], document)
          add_training('armed_traffic_car', 'Firearms training', 5, 'Police training centre', note='The armed traffic vehicle retains the five-day Firearms training requirement alongside roads-policing education.')
          for canonical_id in ('dog_support_unit', 'multiple_dog_carrier'):
              add_training(canonical_id, 'Dog handling', 5, 'Police training centre', source=PSU_URL if canonical_id == 'multiple_dog_carrier' else TRAINING_URL, note='The official UK training matrix publishes Dog handling as a five-day vehicle-operating course.')
              document = records[canonical_id]
              retain_source(document, TRAINING_URL)
              write_json(paths[canonical_id], document)
          for canonical_id in ('traffic_car', 'armed_traffic_car'):
              add_training(canonical_id, 'Roads Policing Officer Training', 3, 'Police training centre', note='The official UK training matrix requires the three-day Roads Policing Officer Training course for Traffic Cars and Armed Traffic Cars.')
          add_training('mounted_unit', 'Mounted Training', 4, 'Police training centre', source=PSU_URL, note='The official PSU page requires Mounted Training; the UK training matrix publishes the course duration as four days.')
          mounted = records['mounted_unit']
          retain_source(mounted, TRAINING_URL)
          write_json(paths['mounted_unit'], mounted)

          # HART base compatibility published by the official UK building page.
          add_buildings('prv', ['HART Base'], HART_URL, aliases=['Primary Response Vehicle', 'Hazard Response Primary'], note='The official HART Base page lists the Hazard Response Primary vehicle.')
          add_buildings('srv', ['HART Base'], HART_URL, aliases=['Secondary Response Vehicle', 'Hazard Response Secondary'], note='The official HART Base page lists the Hazard Response Secondary vehicle.')
          add_buildings('operational_team_leader_vehicle', ['HART Base'], HART_URL, note='The official HART Base page lists the Operational Team Leader vehicle.')
          add_buildings('rapid_response_vehicle', ['HART Base'], HART_URL, aliases=['Fly Car'], note='The official HART Base page lists the Fly Car response vehicle.')
          add_buildings('atv_carrier', ['HART Base'], HART_URL, note='The official HART Base page lists the ATV Carrier.')
          add_buildings('welfare_vehicle', ['HART Base'], HART_URL, aliases=['Emergency Welfare'], note='The official HART Base page lists Emergency Welfare; no HART training requirement is added because official release notes removed it.')
          add_buildings('operational_support_unit', ['HART Base'], HART_URL, aliases=['Operations Support EMS'], note='The official HART Base page lists Operations Support EMS.')
          add_buildings('ambulance_control_unit', ['HART Base'], HART_URL, aliases=['Mobile Command'], note='The official HART Base page lists Mobile Command.')

          # Other official specialist-building compatibility.
          for canonical_id in ('ambulance', 'rapid_response_vehicle', 'operational_team_leader_vehicle', 'ambulance_control_unit', 'cbrn_vehicle'):
              add_buildings(canonical_id, ['Small Ambulance Station'], SMALL_AMBULANCE_URL, note='The official Small Ambulance Station page lists this UK ambulance-service resource as an available vehicle.')
          add_buildings('air_ambulance', ['Helicopter Station'], HELICOPTER_URL, resource_class='aircraft', note='The official Helicopter Station page identifies HEMS/Air Ambulance as the station vehicle.')
          add_buildings('police_helicopter', ['Police Helicopter Station'], POLICE_HELICOPTER_URL, resource_class='aircraft', note='The official Police Helicopter Station page identifies the police helicopter and Police aviation requirement.')
          for canonical_id in ('police_car', 'dog_support_unit', 'armed_response_vehicle', 'traffic_car', 'armed_traffic_car'):
              add_buildings(canonical_id, ['Large Police Depot'], LARGE_POLICE_URL, note='The official Large Police Depot page lists this resource among the vehicles available at the depot.')

          schema_path = ROOT / 'data' / 'schema' / 'vehicle.schema.json'
          schema = read_json(schema_path)
          schema['properties']['training_requirements'] = {
              'type': 'array',
              'minItems': 1,
              'uniqueItems': True,
              'items': {'$ref': '#/$defs/trainingRequirement'},
          }
          schema['$defs']['trainingRequirement'] = {
              'type': 'object',
              'required': ['course', 'duration_days', 'school'],
              'properties': {
                  'course': {'type': 'string', 'minLength': 1},
                  'duration_days': {'type': 'integer', 'minimum': 1},
                  'school': {'type': 'string', 'minLength': 1},
              },
              'additionalProperties': False,
          }
          write_json(schema_path, schema)

          inventory_module = ROOT / 'scripts' / 'vehicle_inventory.py'
          text = inventory_module.read_text(encoding='utf-8')
          anchor = '        "training": count_present(canonical_values, "training", nonempty=True),\n'
          if text.count(anchor) != 1:
              raise SystemExit('Vehicle training completeness anchor is not unique')
          if '"training_requirements": count_present' not in text:
              text = text.replace(anchor, anchor + '        "training_requirements": count_present(canonical_values, "training_requirements", nonempty=True),\n')
          inventory_module.write_text(text, encoding='utf-8')

          evidence_path = ROOT / 'docs' / 'reference' / 'verified-vehicle-training-hart-batch-3.md'
          evidence_path.write_text('''# Verified Vehicle Training and HART Batch 3\n\nThis Stage 36A batch converts the official UK course matrix into structured vehicle requirements and records official specialist-building compatibility.\n\n## Coverage\n\n- Fire Academy: HazMat, Mobile command and ARFF-Training;\n- Rescue (EMS) Academy: Critical care, HART Training, Tactical Command Course, SORT Training and Ambulance Officer;\n- Police training centre: Police aviation, Firearms training, Dog handling, Roads Policing Officer Training and Mounted Training;\n- HART Base, Small Ambulance Station, Helicopter Station, Police Helicopter Station and Large Police Depot compatibility.\n\n## Evidence boundary\n\nThe batch records only explicit official course-to-vehicle and building-to-vehicle relationships. It does not infer vehicle prices, staffing or a training requirement for welfare vehicles; official release history states that the HART training requirement was removed from welfare vehicles.\n\n## Sources\n\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1603-which-training-is-useful-for-what/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1736-what-is-a-hart-base/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1741-what-is-the-large-police-depot-uk-version/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1715-what-is-a-small-ambulance-station/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1720-what-is-a-helicopter-station/\n- https://xyrality.helpshift.com/hc/en/23-mission-chief/faq/1731-what-is-a-police-helicopter-station/\n''', encoding='utf-8')

          mkdocs_path = ROOT / 'mkdocs.yml'
          text = mkdocs_path.read_text(encoding='utf-8')
          anchor = '          - Official Vehicle Enrichment Batch 2: reference/verified-vehicle-official-enrichment-batch-2.md\n'
          addition = anchor + '          - Vehicle Training & HART Batch 3: reference/verified-vehicle-training-hart-batch-3.md\n'
          if text.count(anchor) != 1:
              raise SystemExit('MkDocs official enrichment anchor is not unique')
          if 'reference/verified-vehicle-training-hart-batch-3.md' not in text:
              text = text.replace(anchor, addition)
          mkdocs_path.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests' / 'python' / 'test_vehicle_training_hart_enrichment.py'
          test_path.write_text('''from __future__ import annotations\n\nimport json\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nVEHICLE_ROOT = ROOT / "data" / "uk" / "vehicles"\n\n\ndef records():\n    output = {}\n    for path in VEHICLE_ROOT.glob("*.json"):\n        document = json.loads(path.read_text(encoding="utf-8"))\n        output[document["id"]] = document\n    return output\n\n\ndef requirement(document, course):\n    return next(item for item in document["training_requirements"] if item["course"] == course)\n\n\nclass VehicleTrainingHartTests(unittest.TestCase):\n    def test_official_training_durations(self):\n        data = records()\n        self.assertEqual(requirement(data["hazmat_unit"], "HazMat")["duration_days"], 3)\n        self.assertEqual(requirement(data["iccu"], "Mobile command")["duration_days"], 5)\n        self.assertEqual(requirement(data["air_ambulance"], "Critical care")["duration_days"], 5)\n        self.assertEqual(requirement(data["prv"], "HART Training")["duration_days"], 5)\n        self.assertEqual(requirement(data["ambulance_control_unit"], "Tactical Command Course")["duration_days"], 5)\n        self.assertEqual(requirement(data["mass_casualty_equipment"], "SORT Training")["duration_days"], 3)\n        self.assertEqual(requirement(data["police_helicopter"], "Police aviation")["duration_days"], 7)\n        self.assertEqual(requirement(data["traffic_car"], "Roads Policing Officer Training")["duration_days"], 3)\n        self.assertEqual(requirement(data["mounted_unit"], "Mounted Training")["duration_days"], 4)\n\n    def test_specialist_building_compatibility(self):\n        data = records()\n        self.assertIn("HART Base", data["prv"]["building_requirements"])\n        self.assertIn("HART Base", data["welfare_vehicle"]["building_requirements"])\n        self.assertNotIn("HART Training", data["welfare_vehicle"].get("training", []))\n        self.assertIn("Large Police Depot", data["armed_response_vehicle"]["building_requirements"])\n        self.assertIn("Police Helicopter Station", data["police_helicopter"]["building_requirements"])\n        self.assertIn("Helicopter Station", data["air_ambulance"]["building_requirements"])\n\n    def test_schema_supports_structured_training(self):\n        schema = json.loads((ROOT / "data" / "schema" / "vehicle.schema.json").read_text(encoding="utf-8"))\n        self.assertIn("training_requirements", schema["properties"])\n        self.assertIn("trainingRequirement", schema["$defs"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate training enrichment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/vehicle_inventory.py
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest tests/python/test_vehicle_official_enrichment.py -v
          python -m unittest tests/python/test_vehicle_training_hart_enrichment.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text(encoding='utf-8'))
          summary = report['summary']
          fields = report['field_completeness']
          assert summary['canonical_records'] == 92, summary
          assert summary['mapped_inventory_entries'] == 73, summary
          assert summary['unresolved_inventory_entries'] == 0, summary
          assert summary['identity_coverage_percent'] == 100.0, summary
          assert fields['training']['complete'] >= 34, fields
          assert fields['training_requirements']['complete'] >= 20, fields
          assert fields['building_requirements']['complete'] >= 40, fields
          assert fields['resource_class']['complete'] >= 40, fields
          print(json.dumps({'summary': summary, 'field_completeness': fields}, indent=2))
          PY
          git diff --check

      - name: Commit training and HART batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            data/schema/vehicle.schema.json \
            data/sources/missionchief-uk/vehicle-coverage.json \
            data/uk/vehicles \
            docs/assets/data/v1 \
            docs/assets/data/official/uk-vehicle-coverage.json \
            docs/reference/vehicle-coverage-status.md \
            docs/reference/verified-vehicle-training-hart-batch-3.md \
            mkdocs.yml \
            scripts/vehicle_inventory.py \
            tests/python/test_vehicle_training_hart_enrichment.py \
            .github/workflows/agent-stage36a-training-hart-batch-3.yml
          git diff --cached --check
          git commit -m 'Stage 36A: enrich vehicle training and HART contracts batch 3'
          git push origin HEAD:stage36a/training-hart-enrichment-batch-3
