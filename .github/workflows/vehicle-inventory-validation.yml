name: Validate UK vehicle inventory

# Pull requests are covered by the path-aware fast and full validation lanes.
# This dedicated workflow remains as an exact-main evidence gate and manual tool.
on:
  push:
    branches: [main]
    paths:
      - data/uk/vehicles/**
      - data/uk/vehicle-field-resolution.json
      - data/schema/vehicle.schema.json
      - data/schema/vehicle-inventory.schema.json
      - data/schema/vehicle-field-resolution.schema.json
      - data/sources/missionchief-uk/vehicle-type-inventory.json
      - data/sources/missionchief-uk/vehicle-coverage.json
      - docs/assets/data/official/uk-vehicle-coverage.json
      - docs/assets/data/official/uk-vehicle-field-resolution.json
      - docs/reference/vehicle-coverage-status.md
      - docs/reference/vehicle-field-resolution.md
      - scripts/vehicle_inventory.py
      - scripts/generate_vehicle_coverage.py
      - scripts/generate_vehicle_field_resolution.py
      - scripts/validate_vehicle_inventory.py
      - tests/python/test_vehicle_inventory.py
      - tests/python/test_vehicle_field_resolution.py
      - .github/workflows/vehicle-inventory-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate schemas, inventory and deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          pairs = (
              (
                  "data/schema/vehicle-inventory.schema.json",
                  "data/sources/missionchief-uk/vehicle-type-inventory.json",
              ),
              (
                  "data/schema/vehicle-field-resolution.schema.json",
                  "data/uk/vehicle-field-resolution.json",
              ),
          )
          for schema_path, document_path in pairs:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              document = json.loads(Path(document_path).read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              ).validate(document)
          PY
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_field_resolution.py --check
          python scripts/generate_vehicle_coverage.py --check
          python -m unittest \
            tests/python/test_vehicle_inventory.py \
            tests/python/test_vehicle_field_resolution.py -v

      - name: Upload vehicle coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-inventory-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/sources/missionchief-uk/vehicle-coverage.json
            docs/reference/vehicle-coverage-status.md
            data/uk/vehicle-field-resolution.json
            docs/reference/vehicle-field-resolution.md
          if-no-files-found: error
          retention-days: 14
