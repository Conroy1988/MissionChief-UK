name: Run Stage 36A complete vehicle ID mapping

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'stage36a/complete-vehicle-id-mapping'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage36a/complete-vehicle-id-mapping
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore and apply mapping payload
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/agent-stage36a-complete-id-mapping.yml
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" "$source_file" | sed '1d;$d' > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.xz"
          echo "ed2c88877f730b43c0fa6e7821e95a0f43d7597554000572a270a7686472647b  $RUNNER_TEMP/payload.xz" | sha256sum --check
          python - <<'PY'
          import lzma, os
          from pathlib import Path
          payload = Path(os.environ['RUNNER_TEMP'], 'payload.xz').read_bytes()
          source = lzma.decompress(payload).decode('utf-8')
          exec(compile(source, 'stage36a-complete-id-mapping.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and validate complete mapping
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_data.py
          python scripts/validate_vehicle_inventory.py
          python scripts/generate_vehicle_coverage.py
          python scripts/generate_vehicle_coverage.py --check
          python scripts/run_public_verification_sync.py
          python scripts/generate_exports.py
          python scripts/generate_faq.py
          python -m unittest tests/python/test_vehicle_inventory.py -v
          python -m unittest discover -s tests/python -p 'test_release_integrity.py' -v
          python scripts/validate_verification_programme_assets.py
          python scripts/release_readiness.py
          python scripts/audit_links.py
          python -m mkdocs build --strict --site-dir site
          python scripts/release_readiness.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('data/sources/missionchief-uk/vehicle-coverage.json').read_text())['summary']
          assert s['inventory_entries'] == 73, s
          assert s['mapped_inventory_entries'] == 73, s
          assert s['unresolved_inventory_entries'] == 0, s
          assert s['identity_coverage_percent'] == 100.0, s
          assert s['canonical_records'] == 92, s
          print(json.dumps(s, indent=2))
          PY
          git diff --check
      - name: Commit complete mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md data/sources/missionchief-uk/vehicle-type-inventory.json data/sources/missionchief-uk/vehicle-coverage.json data/uk/vehicles docs/index.md docs/api/index.md docs/assets/data/v1 docs/assets/data/official/uk-vehicle-coverage.json docs/reference/generated-faq.md docs/reference/vehicle-coverage-status.md docs/reference/vehicle-id-mapping-completion.md mkdocs.yml tests/python/test_release_integrity.py
          git diff --cached --check
          git commit -m 'Stage 36A: map all observed UK vehicle type IDs'
          git push origin HEAD:stage36a/complete-vehicle-id-mapping
